<!DOCTYPE html>
<html lang="en">
    

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ZENOVA V2 - Live Classes</title>

    <link
        rel="stylesheet"
        href="./live.css"
    >

</head>


<body>

    <div class="page">

        <header class="topbar">

            <div>

                <div class="brand">
                    ZENOVA
                </div>

                <div class="subtitle">
                    V2 LIVE CLASS SCHEDULING
                </div>

            </div>

        </header>


        <main class="container">

            <div class="page-heading">

                <h1>
                    Schedule Live Class
                </h1>

                <p>
                    Create and schedule a live class for students.
                </p>

            </div>


            <section class="card">

                <form id="liveClassForm">


                    <!-- TITLE -->

                    <div class="form-group">

                        <label for="title">
                            Class Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            placeholder="Enter live class title"
                            required
                        >

                    </div>


                    <!-- TEACHER -->

                    <div class="form-group">

                        <label for="teacherName">
                            Teacher Name
                        </label>

                        <input
                            type="text"
                            id="teacherName"
                            placeholder="Enter teacher name"
                            required
                        >

                    </div>


                    <!-- COURSE -->

                    <div class="form-group">

                        <label for="courseSelect">
                            Course / Batch
                        </label>

                        <select
                            id="courseSelect"
                            required
                        >

                            <option value="">
                                Select Course
                            </option>

                        </select>

                    </div>


                    <!-- SUBJECT -->

                    <div class="form-group">

                        <label for="subjectSelect">
                            Subject
                        </label>

                        <select
                            id="subjectSelect"
                            required
                            disabled
                        >

                            <option value="">
                                Select Subject
                            </option>

                        </select>

                    </div>


                    <!-- CHAPTER -->

                    <div class="form-group">

                        <label for="chapterSelect">
                            Chapter
                        </label>

                        <select
                            id="chapterSelect"
                            disabled
                        >

                            <option value="">
                                Select Chapter
                            </option>

                        </select>

                    </div>


                    <!-- THUMBNAIL -->

                    <div class="form-group">

                        <label for="thumbnailUrl">
                            Thumbnail URL
                        </label>

                        <input
                            type="url"
                            id="thumbnailUrl"
                            placeholder="https://..."
                        >

                        <small>
                            Paste the Firebase Storage or image URL.
                        </small>

                    </div>


                    <!-- DATE -->

                    <div class="form-row">

                        <div class="form-group">

                            <label for="scheduledDate">
                                Date
                            </label>

                            <input
                                type="date"
                                id="scheduledDate"
                                required
                            >

                        </div>


                        <!-- TIME -->

                        <div class="form-group">

                            <label for="scheduledTime">
                                Time
                            </label>

                            <input
                                type="time"
                                id="scheduledTime"
                                required
                            >

                        </div>

                    </div>


                    <!-- PREVIEW -->

                    <div
                        id="preview"
                        class="preview hidden"
                    >

                        <div class="preview-title">
                            CLASS PREVIEW
                        </div>

                        <div
                            id="previewContent"
                        ></div>

                    </div>


                    <!-- MESSAGE -->

                    <div
                        id="message"
                        class="message"
                    ></div>


                    <!-- BUTTON -->

                    <button
                        type="submit"
                        id="scheduleButton"
                        class="schedule-button"
                    >

                        SCHEDULE LIVE CLASS

                    </button>


                </form>

            </section>


            <!-- SCHEDULED CLASSES -->

            <section class="scheduled-section">

                <div class="section-heading">

                    <div>

                        <h2>
                            Scheduled Classes
                        </h2>

                        <p>
                            Upcoming live classes
                        </p>

                    </div>

                    <button
                        id="refreshButton"
                        class="refresh-button"
                    >
                        Refresh
                    </button>

                </div>


                <div
                    id="classList"
                    class="class-list"
                >

                    <div class="empty">
                        Loading...
                    </div>

                </div>

            </section>

        </main>

    </div>


    <script
        type="module"
        src="./live.js"
    ></script>

</body>

</html>
