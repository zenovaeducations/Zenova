<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zenova Educations</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #ffffff;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        .splash {
            width: 100%;
            height: 100vh;
            height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;
        }

        .logo-wrapper {
            position: relative;

            width: 86px;
            height: 86px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-ring {
            position: absolute;

            width: 86px;
            height: 86px;

            border-radius: 50%;

            border: 2px solid #eeeeee;
            border-top-color: #7c3aed;

            animation: spin 1s linear infinite;
        }

        .logo {
            width: 48px;
            height: 48px;

            object-fit: contain;

            display: block;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .loading-ring {
                animation-duration: 2.5s;
            }
        }
    </style>
</head>

<body>

    <main class="splash" aria-label="Loading Zenova Educations">

        <div class="logo-wrapper">

            <div class="loading-ring"></div>

            <img
                src="./logo.png"
                alt="Zenova Educations"
                class="logo"
            >

        </div>

    </main>

</body>
</html>
