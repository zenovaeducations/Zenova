<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <meta
        name="description"
        content="Zenova Educations"
    >

    <title>Zenova Educations</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }


        html,
        body {

            width: 100%;

            height: 100%;

            overflow: hidden;

        }


        body {

            background: #050505;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        /* =====================================================
           SPLASH
        ===================================================== */

        .zenova-splash {

            position: fixed;

            inset: 0;

            width: 100%;

            height: 100%;

            background:

                radial-gradient(
                    circle at center,
                    rgba(108, 59, 255, 0.13),
                    transparent 38%
                ),

                #050505;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            z-index: 99999;

        }


        /* =====================================================
           LOGO AREA
        ===================================================== */

        .logo-container {

            position: relative;

            width: 150px;

            height: 150px;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        /* =====================================================
           PURPLE ROTATING RING
        ===================================================== */

        .loading-ring {

            position: absolute;

            width: 118px;

            height: 118px;

            border-radius: 50%;

            border: 2px solid
                rgba(108, 59, 255, 0.14);

            border-top-color:
                #6c3bff;

            border-right-color:
                #8b68ff;

            animation:
                zenovaRotate 1.15s
                linear infinite;

            box-shadow:

                0 0 18px
                rgba(108, 59, 255, 0.20),

                inset 0 0 18px
                rgba(108, 59, 255, 0.08);

        }


        /* =====================================================
           SECOND RING
        ===================================================== */

        .loading-ring-small {

            position: absolute;

            width: 92px;

            height: 92px;

            border-radius: 50%;

            border: 1px solid
                rgba(255, 255, 255, 0.07);

            animation:
                zenovaRotateReverse 2.2s
                linear infinite;

        }


        /* =====================================================
           Z MARK
        ===================================================== */

        .zenova-z {

            position: relative;

            color: #ffffff;

            font-size: 48px;

            font-weight: 800;

            letter-spacing: -5px;

            line-height: 1;

            z-index: 2;

            text-shadow:

                0 0 20px
                rgba(108, 59, 255, 0.5);

            animation:
                zenovaPulse 2s
                ease-in-out infinite;

        }


        /* =====================================================
           BRAND
        ===================================================== */

        .brand {

            margin-top: 20px;

            text-align: center;

            animation:
                brandAppear 1s
                ease forwards;

        }


        .brand-name {

            color: #ffffff;

            font-size: 22px;

            font-weight: 800;

            letter-spacing: 5px;

        }


        .brand-subtitle {

            color: #8f8f8f;

            font-size: 7px;

            letter-spacing: 5px;

            margin-top: 7px;

        }


        /* =====================================================
           LOADING TEXT
        ===================================================== */

        .loading-text {

            margin-top: 30px;

            color: #777777;

            font-size: 9px;

            letter-spacing: 2px;

            text-transform: uppercase;

            animation:
                textPulse 1.5s
                ease-in-out infinite;

        }


        /* =====================================================
           ANIMATIONS
        ===================================================== */

        @keyframes zenovaRotate {

            from {

                transform:
                    rotate(0deg);

            }

            to {

                transform:
                    rotate(360deg);

            }

        }


        @keyframes zenovaRotateReverse {

            from {

                transform:
                    rotate(360deg);

            }

            to {

                transform:
                    rotate(0deg);

            }

        }


        @keyframes zenovaPulse {

            0%,
            100% {

                transform:
                    scale(1);

                opacity: 1;

            }

            50% {

                transform:
                    scale(1.05);

                opacity: 0.88;

            }

        }


        @keyframes brandAppear {

            from {

                opacity: 0;

                transform:
                    translateY(8px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        @keyframes textPulse {

            0%,
            100% {

                opacity: 0.45;

            }

            50% {

                opacity: 1;

            }

        }


        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media
        (prefers-reduced-motion: reduce) {

            .loading-ring,
            .loading-ring-small,
            .zenova-z,
            .brand,
            .loading-text {

                animation: none;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         ZENOVA SPLASH
    ===================================================== -->

    <div
        id="zenovaSplash"
        class="zenova-splash"
    >


        <div class="logo-container">


            <div
                class="loading-ring"
            ></div>


            <div
                class="loading-ring-small"
            ></div>


            <div
                class="zenova-z"
            >
                Z
            </div>


        </div>


        <div class="brand">

            <div class="brand-name">
                ZENOVA
            </div>

            <div class="brand-subtitle">
                EDUCATIONS
            </div>

        </div>


        <div class="loading-text">
            Preparing your learning space
        </div>


    </div>



    <!-- =====================================================
         ENTRY SCRIPT
    ===================================================== -->

    <script type="module">

        import {
            watchAuth
        } from "./firebase/auth.js";


        /*
         * -----------------------------------------------------
         * ZENOVA ENTRY SYSTEM
         *
         * The splash remains visible for a minimum of 3 seconds.
         *
         * During this time Firebase checks whether the student
         * already has an authenticated session.
         * -----------------------------------------------------
         */


        const splash =
            document.getElementById(
                "zenovaSplash"
            );


        const splashStartTime =
            Date.now();


        const minimumSplashTime =
            3000;


        let firebaseUser =
            undefined;


        let firebaseResolved =
            false;


        // =====================================================
        // FIREBASE AUTH CHECK
        // =====================================================

        watchAuth((user) => {

            firebaseUser = user;

            firebaseResolved = true;

            attemptRedirect();

        });


        // =====================================================
        // REDIRECT CONTROLLER
        // =====================================================

        function attemptRedirect() {

            if (!firebaseResolved) {

                return;

            }


            const elapsed =
                Date.now() -
                splashStartTime;


            const remaining =
                Math.max(
                    0,
                    minimumSplashTime -
                    elapsed
                );


            setTimeout(
                () => {

                    if (firebaseUser) {

                        /*
                         * User is already logged in.
                         *
                         * IMPORTANT:
                         * Do NOT send them to login.
                         */

                        window.location.replace(
                            "./home/"
                        );

                    } else {

                        /*
                         * User is not logged in.
                         */

                        window.location.replace(
                            "./login/"
                        );

                    }

                },
                remaining
            );

        }


        // =====================================================
        // SAFETY FALLBACK
        // =====================================================

        /*
         * Firebase normally resolves quickly.
         *
         * If there is an unexpected delay, we keep the
         * beautiful splash instead of showing a broken page.
         *
         * We deliberately do NOT redirect without knowing
         * the authentication state.
         */

    </script>


</body>

</html>
