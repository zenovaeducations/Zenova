<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>Zenova Educations</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #050505;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .splash {
            position: fixed;
            inset: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: #050505;
        }

        .logo {
            position: relative;

            width: 100px;
            height: 100px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring {
            position: absolute;

            width: 82px;
            height: 82px;

            border-radius: 50%;

            border: 2px solid
                rgba(108, 59, 255, 0.15);

            border-top-color:
                #6c3bff;

            animation:
                rotate 1s linear infinite;
        }

        .z {
            color: #ffffff;

            font-size: 38px;
            font-weight: 800;

            position: relative;
            z-index: 2;
        }

        .brand {
            margin-top: 18px;

            color: #ffffff;

            font-size: 20px;
            font-weight: 800;

            letter-spacing: 5px;
        }

        .subtitle {
            margin-top: 6px;

            color: #777777;

            font-size: 7px;

            letter-spacing: 4px;
        }

        @keyframes rotate {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

    </style>

</head>


<body>

    <div class="splash">

        <div class="logo">

            <div class="ring"></div>

            <div class="z">
                Z
            </div>

        </div>

        <div class="brand">
            ZENOVA
        </div>

        <div class="subtitle">
            EDUCATIONS
        </div>

    </div>


    <script type="module">

        import {
            auth,
            db
        } from "./firebase/firebase-config.js";

        import {
            onAuthStateChanged
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

        import {
            doc,
            getDoc
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        // =====================================================
        // SPLASH TIMER
        // =====================================================

        const splashStart =
            Date.now();

        const minimumSplashTime =
            3000;


        // =====================================================
        // AUTH STATE
        // =====================================================

        onAuthStateChanged(
            auth,
            async (user) => {

                try {

                    // -----------------------------------------
                    // NOT LOGGED IN
                    // -----------------------------------------

                    if (!user) {

                        await waitForSplash();

                        window.location.replace(
                            "./login/"
                        );

                        return;

                    }


                    // -----------------------------------------
                    // USER IS LOGGED IN
                    // -----------------------------------------

                    /*
                     * IMPORTANT:
                     *
                     * Being authenticated does NOT mean
                     * onboarding is completed.
                     *
                     * We now check the student's Firestore
                     * profile.
                     */

                    const studentRef =
                        doc(
                            db,
                            "students",
                            user.uid
                        );


                    const studentSnapshot =
                        await getDoc(
                            studentRef
                        );


                    await waitForSplash();


                    // -----------------------------------------
                    // PROFILE EXISTS
                    // -----------------------------------------

                    if (
                        studentSnapshot.exists()
                    ) {

                        /*
                         * Returning student.
                         *
                         * Skip login.
                         * Skip onboarding.
                         */

                        window.location.replace(
                            "./home/"
                        );

                        return;

                    }


                    // -----------------------------------------
                    // PROFILE DOES NOT EXIST
                    // -----------------------------------------

                    /*
                     * New authenticated student.
                     *
                     * They have logged into Google,
                     * but haven't completed Zenova
                     * onboarding yet.
                     */

                    window.location.replace(
                        "./onboarding/"
                    );


                } catch (error) {

                    console.error(
                        "Zenova startup error:",
                        error
                    );


                    /*
                     * Don't send the student to Home
                     * when we couldn't determine their
                     * profile state.
                     *
                     * Keeping the system conservative is
                     * safer than accidentally granting access.
                     */

                    await waitForSplash();


                    window.location.replace(
                        "./login/"
                    );

                }

            }
        );


        // =====================================================
        // KEEP SPLASH FOR MINIMUM 3 SECONDS
        // =====================================================

        function waitForSplash() {

            const elapsed =
                Date.now() -
                splashStart;

            const remaining =
                Math.max(
                    0,
                    minimumSplashTime -
                    elapsed
                );


            return new Promise(
                resolve => {

                    setTimeout(
                        resolve,
                        remaining
                    );

                }
            );

        }

    </script>

</body>

</html>
