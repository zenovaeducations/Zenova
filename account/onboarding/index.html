<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Zenova — Onboarding</title>

    <link rel="stylesheet" href="./onboarding.css">

    <script type="module" src="./onboarding.js"></script>
</head>

<body>

    <!-- Loading -->
    <div id="zenovaLoader" class="loader-screen">
        <div class="loader-ring">
            <span>Z</span>
        </div>
    </div>


    <!-- Onboarding -->
    <main id="onboardingApp" class="onboarding-app hidden">

        <div class="onboarding-container">

            <header class="top-header">

                <div class="brand">
                    <div class="brand-mark">Z</div>
                    <span>ZENOVA</span>
                </div>

                <div class="step-indicator">
                    <span id="stepText">1 of 3</span>
                </div>

            </header>


            <!-- Progress -->
            <div class="progress-area">
                <div class="progress-track">
                    <div id="progressBar" class="progress-bar"></div>
                </div>
            </div>


            <!-- STEP 1 -->
            <section id="step1" class="step active">

                <div class="step-heading">
                    <span class="eyebrow">WELCOME</span>

                    <h1>Let's get to know you.</h1>

                    <p>
                        Tell us a little about yourself to set up
                        your Zenova student account.
                    </p>
                </div>


                <div class="form-grid">

                    <div class="field full">
                        <label for="fullName">Full Name</label>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                        >
                    </div>


                    <div class="field">
                        <label for="dob">Date of Birth</label>

                        <input
                            type="date"
                            id="dob"
                        >
                    </div>


                    <div class="field">
                        <label for="gender">Gender</label>

                        <select id="gender">
                            <option value="">Select gender</option>
                            <option value="MALE">Male</option>
                            <option value="FEMALE">Female</option>
                            <option value="OTHER">Other</option>
                            <option value="PREFER_NOT_TO_SAY">
                                Prefer not to say
                            </option>
                        </select>
                    </div>

                </div>

                <button
                    type="button"
                    class="continue-btn"
                    id="step1Next"
                >
                    Continue
                    <span>→</span>
                </button>

            </section>


            <!-- STEP 2 -->
            <section id="step2" class="step">

                <div class="step-heading">
                    <span class="eyebrow">ACADEMIC</span>

                    <h1>Tell us about your studies.</h1>

                    <p>
                        We'll use this information to personalize
                        your learning experience.
                    </p>
                </div>


                <div class="form-grid">

                    <div class="field full">
                        <label for="className">
                            Current Class
                        </label>

                        <select id="className">
                            <option value="">Select your class</option>
                            <option value="Under 8th">Under 8th</option>
                            <option value="8th">8th</option>
                            <option value="9th">9th</option>
                            <option value="10th">10th</option>
                            <option value="1st PUC">1st PUC</option>
                            <option value="2nd PUC">2nd PUC</option>
                        </select>
                    </div>


                    <!-- 10th only -->
                    <div
                        class="conditional-fields"
                        id="tenthFields"
                    >

                        <div class="field">
                            <label for="board">Board</label>

                            <select id="board">
                                <option value="">
                                    Select board
                                </option>

                                <option value="KSEAB">
                                    Karnataka State Board
                                </option>

                                <option value="CBSE">
                                    CBSE
                                </option>

                                <option value="ICSE">
                                    ICSE
                                </option>

                                <option value="OTHER">
                                    Other
                                </option>
                            </select>
                        </div>

                    </div>


                    <div class="field full">
                        <label for="medium">Medium</label>

                        <select id="medium">
                            <option value="">
                                Select medium
                            </option>

                            <option value="KANNADA">
                                Kannada
                            </option>

                            <option value="ENGLISH">
                                English
                            </option>
                        </select>
                    </div>


                    <!-- PUC only -->
                    <div
                        class="conditional-fields"
                        id="pucFields"
                    >

                        <div class="field">
                            <label for="combination">
                                Combination
                            </label>

                            <select id="combination">

                                <option value="">
                                    Select combination
                                </option>

                                <option value="PCMB">
                                    PCMB
                                </option>

                                <option value="PCMC">
                                    PCMC
                                </option>

                                <option value="PCMS">
                                    PCMS
                                </option>

                                <option value="CEBA">
                                    CEBA
                                </option>

                                <option value="SEBA">
                                    SEBA
                                </option>

                                <option value="HEBA">
                                    HEBA
                                </option>

                                <option value="OTHER">
                                    Other
                                </option>

                            </select>
                        </div>


                        <div class="field">
                            <label for="target">
                                Target
                            </label>

                            <select id="target">

                                <option value="">
                                    Select target
                                </option>

                                <option value="NEET">
                                    NEET
                                </option>

                                <option value="JEE">
                                    JEE
                                </option>

                                <option value="CET">
                                    KCET
                                </option>

                                <option value="CA">
                                    CA
                                </option>

                                <option value="OTHER">
                                    Other
                                </option>

                            </select>
                        </div>

                    </div>

                </div>


                <div class="button-row">

                    <button
                        type="button"
                        class="back-btn"
                        id="step2Back"
                    >
                        ← Back
                    </button>

                    <button
                        type="button"
                        class="continue-btn"
                        id="step2Next"
                    >
                        Continue
                        <span>→</span>
                    </button>

                </div>

            </section>


            <!-- STEP 3 -->
            <section id="step3" class="step">

                <div class="step-heading">
                    <span class="eyebrow">YOUR SCHOOL</span>

                    <h1>Where do you study?</h1>

                    <p>
                        Select your location and school.
                    </p>
                </div>


                <div class="form-grid">

                    <div class="field">
                        <label for="district">
                            District
                        </label>

                        <select id="district">
                            <option value="">
                                Select district
                            </option>
                        </select>
                    </div>


                    <div class="field">
                        <label for="taluk">
                            Taluk
                        </label>

                        <select id="taluk" disabled>
                            <option value="">
                                Select taluk
                            </option>
                        </select>
                    </div>


                    <div class="field">
                        <label for="gramPanchayat">
                            Gram Panchayat
                        </label>

                        <select
                            id="gramPanchayat"
                            disabled
                        >
                            <option value="">
                                Select Gram Panchayat
                            </option>
                        </select>
                    </div>


                    <div class="field">
                        <label for="village">
                            Village
                        </label>

                        <select
                            id="village"
                            disabled
                        >
                            <option value="">
                                Select village
                            </option>
                        </select>
                    </div>


                    <div class="field full">
                        <label for="school">
                            School
                        </label>

                        <select
                            id="school"
                            disabled
                        >
                            <option value="">
                                Select your school
                            </option>
                        </select>
                    </div>

                </div>


                <div
                    id="formError"
                    class="form-error"
                ></div>


                <div class="button-row">

                    <button
                        type="button"
                        class="back-btn"
                        id="step3Back"
                    >
                        ← Back
                    </button>

                    <button
                        type="button"
                        class="continue-btn"
                        id="finishBtn"
                    >
                        Finish
                        <span>→</span>
                    </button>

                </div>

            </section>

        </div>

    </main>

</body>
</html>
