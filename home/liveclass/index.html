<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Zenova Live Class</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        body {
            overflow: hidden;
        }

        #app {
            width: 100%;
            height: 100%;
        }

        /* --------------------------------
           LOADING SCREEN
        -------------------------------- */

        #loadingScreen {
            position: fixed;
            inset: 0;
            z-index: 9999;

            background:
                linear-gradient(
                    180deg,
                    #111111 0%,
                    #050505 100%
                );

            color: #ffffff;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .live-pill {
            background: #ef1111;
            color: #ffffff;

            padding: 8px 16px;

            border-radius: 8px;

            font-size: 12px;
            font-weight: 800;

            margin-bottom: 22px;
        }

        #loadingScreen h1 {
            margin: 0;

            font-size: 28px;
            font-weight: 800;
        }

        #loadingScreen p {
            margin-top: 10px;

            color: #a3a3a3;

            font-size: 14px;
        }

        .loader {
            width: 38px;
            height: 38px;

            border: 3px solid #333;
            border-top-color: #ffffff;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;

            margin-bottom: 25px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* --------------------------------
           ERROR
        -------------------------------- */

        #errorScreen {
            position: fixed;
            inset: 0;

            z-index: 9999;

            background: #090909;

            color: #ffffff;

            display: none;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 30px;
        }

        .error-box {
            max-width: 500px;
        }

        .error-box h2 {
            margin-bottom: 10px;
        }

        .error-box p {
            color: #a3a3a3;
            line-height: 1.6;
        }

        .back-button {
            margin-top: 20px;

            border: none;

            background: #ffffff;
            color: #111111;

            padding: 12px 20px;

            border-radius: 10px;

            font-weight: 700;

            cursor: pointer;
        }

        /* --------------------------------
           ZOOM AREA
        -------------------------------- */

        #meetingSDKElement {
            width: 100%;
            height: 100%;

            background: #000;
        }

    </style>
</head>

<body>

    <div id="app">

        <!-- LOADING -->

        <div id="loadingScreen">

            <div class="live-pill">
                ● LIVE
            </div>

            <div class="loader"></div>

            <h1>
                Connecting to Zoom
            </h1>

            <p id="loadingText">
                The live classroom is being connected.
            </p>

        </div>


        <!-- ERROR -->

        <div id="errorScreen">

            <div class="error-box">

                <h2>
                    Unable to join live class
                </h2>

                <p id="errorText">
                    Something went wrong while connecting to the live classroom.
                </p>

                <button
                    class="back-button"
                    onclick="history.back()"
                >
                    Go Back
                </button>

            </div>

        </div>


        <!-- ZOOM -->

        <div id="meetingSDKElement"></div>

    </div>


    <!--
        ZOOM MEETING SDK

        Zoom currently recommends Meeting SDK
        5.1.4 or later for WebRTC compatibility.
    -->

    <script src="https://source.zoom.us/5.1.4/lib/vendor/react.min.js"></script>

    <script src="https://source.zoom.us/5.1.4/lib/vendor/react-dom.min.js"></script>

    <script src="https://source.zoom.us/5.1.4/lib/vendor/redux.min.js"></script>

    <script src="https://source.zoom.us/5.1.4/lib/vendor/redux-thunk.min.js"></script>

    <script src="https://source.zoom.us/5.1.4/lib/vendor/lodash.min.js"></script>

    <script src="https://source.zoom.us/zoom-meeting-5.1.4.min.js"></script>


    <!-- ZENOVA -->

    <script
        type="module"
        src="./liveclass.js"
    ></script>

</body>
</html>
