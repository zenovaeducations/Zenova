<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ZENOVA | Home</title>

    <meta
        name="theme-color"
        content="#111111"
    >

    <!-- Remix Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
        rel="stylesheet"
    >

    <!-- Poppins -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="./home.css"
    >

</head>


<body>


<!-- =========================================================
     LOADER
========================================================= -->

<div
    id="zenovaLoader"
    class="loader"
>

    <div class="loader-logo">
        ZENOVA
    </div>

    <div class="loader-line"></div>

</div>


<!-- =========================================================
     APP
========================================================= -->

<div
    id="zenovaApp"
    class="app hidden"
>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="home-header">

        <div>

            <span class="welcome-small">
                WELCOME BACK
            </span>

            <h1>
                Good Morning,
                <span id="studentName">
                    Student
                </span>
                👋
            </h1>

            <p>
                Let's make today productive.
            </p>

        </div>


        <button
            id="profileShortcut"
            class="profile-button"
        >

            <span id="profileInitial">
                S
            </span>

        </button>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="home-main">


        <!-- =================================================
             BANNER
        ================================================== -->

        <section
            id="heroSection"
            class="hero-section hidden"
        >

            <div
                id="heroSlider"
                class="hero-slider"
            ></div>

            <div
                id="heroDots"
                class="hero-dots"
            ></div>

        </section>



        <!-- =================================================
             FOUR QUICK CARDS
        ================================================== -->

        <section class="quick-section">

            <div class="quick-grid">


                <!-- REVISION -->

                <button
                    class="quick-card"
                    data-route="revision"
                >

                    <div class="quick-icon revision">
                        <i class="ri-book-open-line"></i>
                    </div>

                    <strong>
                        Revision Classes
                    </strong>

                    <span>
                        Revise important concepts
                    </span>

                </button>



                <!-- LIVE -->

                <button
                    class="quick-card"
                    data-route="live"
                >

                    <div class="quick-icon live">
                        <i class="ri-live-line"></i>
                    </div>

                    <strong>
                        Live
                    </strong>

                    <span>
                        Join live classes
                    </span>

                </button>



                <!-- TESTS -->

                <button
                    class="quick-card"
                    data-route="tests"
                >

                    <div class="quick-icon tests">
                        <i class="ri-file-list-3-line"></i>
                    </div>

                    <strong>
                        Tests
                    </strong>

                    <span>
                        Practice & test yourself
                    </span>

                </button>



                <!-- DOUBTS -->

                <button
                    class="quick-card"
                    data-route="doubts"
                >

                    <div class="quick-icon doubts">
                        <i class="ri-question-answer-line"></i>
                    </div>

                    <strong>
                        Ask Doubt
                    </strong>

                    <span>
                        Clear your doubts
                    </span>

                </button>

            </div>

        </section>



        <!-- =================================================
             MY BATCHES
        ================================================== -->

        <section
            id="myBatchesSection"
            class="home-section"
        >

            <div class="section-heading">

                <div>

                    <span>
                        YOUR LEARNING
                    </span>

                    <h2>
                        My Batches
                    </h2>

                </div>

            </div>


            <div
                id="myBatchesList"
                class="batch-list"
            >

                <div class="loading-card">
                    Loading batches...
                </div>

            </div>

        </section>



        <!-- =================================================
             TODAY'S LIVE CLASS
        ================================================== -->

        <section
            id="liveSection"
            class="home-section"
        >

            <div class="section-heading">

                <div>

                    <span>
                        LIVE & SCHEDULE
                    </span>

                    <h2>
                        Today's Classes
                    </h2>

                </div>


                <a href="../live/">
                    View All →
                </a>

            </div>


            <div
                id="liveList"
                class="live-list"
            >

                <div class="loading-card">
                    Loading today's classes...
                </div>

            </div>

        </section>



        <!-- =================================================
             CONTINUE LEARNING
        ================================================== -->

        <section
            id="continueSection"
            class="home-section"
        >

            <div class="section-heading">

                <div>

                    <span>
                        KEEP LEARNING
                    </span>

                    <h2>
                        Continue Learning
                    </h2>

                </div>

            </div>


            <div
                id="continueCard"
                class="continue-card"
            ></div>

        </section>



        <!-- =================================================
             ZENOVA AI
        ================================================== -->

        <section class="home-section ai-section">

            <button
                id="aiButton"
                class="ai-card"
            >

                <div class="ai-logo">
                    Z
                </div>


                <div class="ai-content">

                    <span>
                        ZENOVA AI
                    </span>

                    <h2>
                        Study with Zenova AI
                    </h2>

                    <p>
                        Ask doubts, understand concepts,
                        practice questions and more.
                    </p>

                </div>


                <div class="ai-arrow">
                    →
                </div>

            </button>

        </section>



        <!-- =================================================
             ANNOUNCEMENTS
        ================================================== -->

        <section
            id="announcementSection"
            class="home-section hidden"
        >

            <div class="section-heading">

                <div>

                    <span>
                        UPDATES
                    </span>

                    <h2>
                        Announcements
                    </h2>

                </div>

            </div>


            <div
                id="announcementList"
                class="announcement-list"
            ></div>

        </section>


        <div class="bottom-space"></div>

    </main>



    <!-- =====================================================
         FIXED BOTTOM NAVIGATION
    ====================================================== -->

    <nav class="bottom-navigation">


        <a
            href="../home/"
            class="nav-item active"
        >

            <i class="ri-home-5-fill"></i>

            <span>
                Home
            </span>

        </a>



        <a
            href="../live/"
            class="nav-item"
        >

            <i class="ri-live-line"></i>

            <span>
                Live
            </span>

        </a>



        <a
            href="../revision/"
            class="nav-item"
        >

            <i class="ri-book-open-line"></i>

            <span>
                Revision
            </span>

        </a>



        <a
            href="../profile/"
            class="nav-item"
        >

            <i class="ri-user-3-line"></i>

            <span>
                Profile
            </span>

        </a>

    </nav>

</div>


<script
    type="module"
    src="./home.js"
></script>

</body>

</html>
