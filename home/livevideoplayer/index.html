<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Live Class | Zenova</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="./livevideoplayer.css">
</head>

<body>

<div class="page">

    <!-- TOP BAR -->
    <header class="topbar">

        <button id="backButton" class="back-button" type="button">
            <span class="back-icon">‹</span>
            <span>Back</span>
        </button>

        <div class="brand">
            <div class="brand-name">ZENOVA</div>
            <div class="brand-live">
                <span class="brand-live-dot"></span>
                LIVE CLASS
            </div>
        </div>

        <div class="topbar-spacer"></div>

    </header>


    <!-- LOADING -->
    <section id="loadingState" class="state-screen">

        <div class="loader"></div>

        <p>Loading live class...</p>

    </section>


    <!-- ERROR -->
    <section id="errorState" class="state-screen hidden">

        <div class="error-icon">!</div>

        <h2>Unable to load class</h2>

        <p id="errorMessage">
            Something went wrong.
        </p>

        <button id="errorBackButton" class="primary-button">
            Go Back
        </button>

    </section>


    <!-- PLAYER APP -->
    <main id="playerApp" class="player-app hidden">

        <!-- PLAYER -->
        <section class="player-section">

            <div id="videoShell" class="video-shell">

                <!-- HTML VIDEO -->
                <video
                    id="videoPlayer"
                    class="video-player"
                    playsinline
                    preload="metadata"
                ></video>


                <!-- YOUTUBE -->
                <div
                    id="youtubeContainer"
                    class="youtube-container hidden"
                ></div>


                <!-- PLAYER OVERLAY -->
                <div id="playerOverlay" class="player-overlay">

                    <!-- TOP LIVE AREA -->
                    <div class="overlay-top">

                        <div id="liveBadge" class="live-badge">
                            <span class="live-dot"></span>
                            LIVE
                        </div>

                        <div
                            id="recordedBadge"
                            class="recorded-badge hidden"
                        >
                            RECORDED
                        </div>

                    </div>


                    <!-- CENTER PLAY -->
                    <button
                        id="centerPlayButton"
                        class="center-play-button"
                        type="button"
                        aria-label="Play"
                    >
                        <span>▶</span>
                    </button>


                    <!-- WATERMARK -->
                    <div id="watermark" class="watermark">

                        <div id="watermarkName">
                            Student
                        </div>

                        <div id="watermarkPhone">
                            XXXXX
                        </div>

                        <div class="watermark-brand">
                            ZENOVA • LIVE
                        </div>

                    </div>


                    <!-- CONTROLS -->
                    <div class="controls-container">

                        <!-- PROGRESS -->
                        <div
                            id="progressContainer"
                            class="progress-container"
                        >

                            <div
                                id="progressBar"
                                class="progress-bar"
                            ></div>

                        </div>


                        <div class="controls-row">

                            <!-- PLAY -->
                            <button
                                id="playPauseButton"
                                class="control-button"
                                type="button"
                                aria-label="Play"
                            >
                                ▶
                            </button>


                            <!-- TIME -->
                            <div
                                id="timeDisplay"
                                class="time-display"
                            >
                                00:00
                            </div>


                            <div class="controls-spacer"></div>


                            <!-- LIVE -->
                            <button
                                id="goLiveButton"
                                class="go-live-button"
                                type="button"
                            >
                                <span class="small-live-dot"></span>
                                LIVE
                            </button>


                            <!-- FULLSCREEN -->
                            <button
                                id="fullscreenButton"
                                class="control-button"
                                type="button"
                                aria-label="Fullscreen"
                            >
                                ⛶
                            </button>

                        </div>

                    </div>

                </div>


                <!-- LIVE LOCK -->
                <div
                    id="liveLockMessage"
                    class="live-lock-message hidden"
                >
                    <div class="lock-icon">🔴</div>

                    <strong>LIVE CLASS</strong>

                    <span>
                        You are watching the class live.
                    </span>

                </div>

            </div>

        </section>


        <!-- CLASS INFORMATION -->
        <section class="class-information">

            <div class="class-status-row">

                <span id="classStatusBadge" class="status-badge live">
                    LIVE NOW
                </span>

                <span id="classTimeText" class="class-time-text">
                    --
                </span>

            </div>


            <h1 id="classTitle">
                Live Class
            </h1>


            <div class="class-meta">

                <span id="courseName">Zenova</span>

                <span class="meta-separator">•</span>

                <span id="subjectName">Subject</span>

                <span class="meta-separator">•</span>

                <span id="chapterName">Chapter</span>

            </div>


            <div class="faculty-row">

                <div class="faculty-avatar">
                    Z
                </div>

                <div>

                    <div class="faculty-label">
                        Faculty
                    </div>

                    <div id="facultyName" class="faculty-name">
                        --
                    </div>

                </div>

            </div>


            <div
                id="descriptionSection"
                class="description-section hidden"
            >

                <h3>About this class</h3>

                <p id="classDescription"></p>

            </div>

        </section>

    </main>

</div>


<script type="module" src="./livevideoplayer.js"></script>

</body>
</html>
