<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Courses | Zenova Educations</title>

    <link rel="stylesheet" href="./batches.css">
</head>

<body>

    <!-- Loading -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loader-ring">
            <span>Z</span>
        </div>
    </div>


    <!-- =========================
         FIXED TOP HEADER
    ========================== -->
    <header class="top-header">

        <button
            id="backButton"
            class="back-button"
            aria-label="Go back"
        >
            <svg viewBox="0 0 24 24">
                <path
                    d="M15 18l-6-6 6-6"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>
        </button>

        <div class="header-title">

            <div class="header-brand">
                ZENOVA EDUCATIONS
            </div>

            <div class="header-page-title">
                Courses
            </div>

        </div>

        <button
            id="notificationButton"
            class="notification-button"
            aria-label="Notifications"
        >
            <svg viewBox="0 0 24 24">
                <path
                    d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
                <path
                    d="M10 21h4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                />
            </svg>

            <span id="notificationDot"></span>
        </button>

    </header>


    <!-- =========================
         MAIN
    ========================== -->
    <main class="page-content">

        <!-- Search -->
        <section class="search-section">

            <div class="search-box">

                <svg viewBox="0 0 24 24">
                    <circle
                        cx="11"
                        cy="11"
                        r="7"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    />

                    <path
                        d="M16.5 16.5L21 21"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                    />
                </svg>

                <input
                    id="searchInput"
                    type="search"
                    placeholder="Search courses..."
                    autocomplete="off"
                >

            </div>

        </section>


        <!-- Filters -->
        <section class="filter-section">

            <div
                id="filterContainer"
                class="filter-container"
            ></div>

        </section>


        <!-- =========================
             YOUR CLASS
        ========================== -->
        <section
            id="yourClassSection"
            class="content-section"
        >

            <div class="section-heading">

                <div class="eyebrow">
                    YOUR CLASS
                </div>

                <h1 id="studentClassTitle">
                    —
                </h1>

            </div>


            <!-- My Batch -->
            <div
                id="myBatchSection"
                class="subsection hidden"
            >

                <div class="subsection-title">
                    MY BATCH
                </div>

                <div id="myBatchContainer"></div>

            </div>


            <!-- Available for student's class -->
            <div
                id="availableSection"
                class="subsection"
            >

                <div class="subsection-title">
                    AVAILABLE FOR YOU
                </div>

                <div id="availableCoursesContainer"></div>

            </div>

        </section>


        <!-- =========================
             OTHER PROGRAMS
        ========================== -->
        <section
            id="otherProgramsSection"
            class="content-section"
        >

            <div class="section-heading">

                <div class="eyebrow">
                    EXPLORE
                </div>

                <h2>
                    Other Programs
                </h2>

            </div>

            <div id="otherProgramsContainer"></div>

        </section>


        <!-- No results -->
        <section
            id="noResults"
            class="no-results hidden"
        >

            <div class="no-results-icon">
                <svg viewBox="0 0 24 24">
                    <circle
                        cx="11"
                        cy="11"
                        r="7"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                    />
                    <path
                        d="M16.5 16.5L21 21"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                    />
                </svg>
            </div>

            <h3>No courses found</h3>

            <p>
                Try another search or filter.
            </p>

        </section>

    </main>


    <!-- =========================
         FIXED BOTTOM NAVIGATION
    ========================== -->
    <nav class="bottom-navigation">

        <!-- HOME -->
        <a
            href="../"
            class="nav-item"
            data-nav="home"
        >

            <span class="nav-icon">

                <svg viewBox="0 0 24 24">
                    <path
                        d="M3 11.5L12 4l9 7.5"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                    <path
                        d="M5.5 10.5V20h13v-9.5"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linejoin="round"
                    />
                </svg>

            </span>

            <span class="nav-label">
                Home
            </span>

        </a>


        <!-- COURSES -->
        <a
            href="./"
            class="nav-item active"
            data-nav="courses"
        >

            <span class="nav-icon">

                <svg viewBox="0 0 24 24">
                    <rect
                        x="5"
                        y="4"
                        width="14"
                        height="16"
                        rx="2"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                    />

                    <path
                        d="M9 8h6M9 12h6M9 16h3"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                    />
                </svg>

            </span>

            <span class="nav-label">
                Courses
            </span>

            <span class="nav-active-line"></span>

        </a>


        <!-- STUDY NOW -->
        <a
            href="../study/"
            class="nav-item"
            data-nav="study"
        >

            <span class="nav-icon">

                <svg viewBox="0 0 24 24">
                    <path
                        d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v17H6.5A2.5 2.5 0 0 0 4 22V5.5Z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linejoin="round"
                    />

                    <path
                        d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v17h4.5A2.5 2.5 0 0 1 20 22V5.5Z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linejoin="round"
                    />

                </svg>

            </span>

            <span class="nav-label">
                Study Now
            </span>

        </a>


        <!-- ZENOVA AI -->
        <a
            href="../ai/"
            class="nav-item"
            data-nav="ai"
        >

            <span class="nav-icon ai-icon">
                Z
            </span>

            <span class="nav-label">
                Zenova AI
            </span>

        </a>


        <!-- PROFILE -->
        <a
            href="../profile/"
            class="nav-item"
            data-nav="profile"
        >

            <span class="nav-icon">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="8"
                        r="3.5"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                    />

                    <path
                        d="M5 20c.8-3.4 3.3-5.2 7-5.2s6.2 1.8 7 5.2"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                    />

                </svg>

            </span>

            <span class="nav-label">
                Profile
            </span>

        </a>

    </nav>


    <script type="module" src="./batches.js"></script>

</body>
</html>
