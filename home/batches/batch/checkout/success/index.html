<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>Welcome to Zenova</title>

    <link
        rel="stylesheet"
        href="success.css"
    >

</head>

<body>

<div
    id="successApp"
    class="success-app"
>


    <!-- =================================================
         PARTICLES
    ================================================= -->

    <canvas
        id="particleCanvas"
    ></canvas>



    <!-- =================================================
         INTRO
    ================================================= -->

    <section
        id="introScene"
        class="scene intro-scene"
    >

        <div
            id="introZ"
            class="intro-z"
        >
            Z
        </div>

    </section>



    <!-- =================================================
         BRAND
    ================================================= -->

    <section
        id="brandScene"
        class="scene brand-scene hidden"
    >

        <div
            id="brandName"
            class="brand-name"
        >
            ZENOVA
        </div>


        <div
            id="brandEducation"
            class="brand-education"
        >
            EDUCATIONS
        </div>

    </section>



    <!-- =================================================
         MESSAGE
    ================================================= -->

    <section
        id="messageScene"
        class="scene message-scene hidden"
    >

        <div
            class="message-small"
        >
            YOU ARE OFFICIALLY PART OF
        </div>


        <div
            id="zenovites"
            class="zenovites"
        >
            ZENOVITES
        </div>


        <div
            id="welcomeLine"
            class="welcome-line"
        >
            Welcome to the journey.
        </div>

    </section>



    <!-- =================================================
         BATCH
    ================================================= -->

    <section
        id="batchScene"
        class="scene batch-scene hidden"
    >

        <div
            class="batch-label"
        >
            YOU'RE ENROLLED IN
        </div>


        <h1
            id="batchName"
            class="batch-name"
        >
        </h1>


        <div
            id="batchSubtitle"
            class="batch-subtitle"
        >
        </div>


        <button
            id="continueButton"
            class="continue-button"
        >
            CONTINUE LEARNING

            <span>
                →
            </span>

        </button>

    </section>



</div>


<script
    type="module"
    src="success-core-Z7mK.js"
></script>

</body>

</html>
