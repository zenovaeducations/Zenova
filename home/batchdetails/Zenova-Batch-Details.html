<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Batch Details - ZENOVA</title>

    <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f6f6f6;

    color: #111;

}


button {

    font-family: inherit;

    cursor: pointer;

}


.hidden {

    display: none !important;

}



/* =========================================
   LOADING
========================================= */

.loading {

    min-height: 100vh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background: #fff;

}


.loading-logo {

    font-size: 28px;

    font-weight: 900;

    letter-spacing: 4px;

}


.loading p {

    margin-top: 10px;

    color: #888;

    font-size: 13px;

}



/* =========================================
   APP
========================================= */

.app {

    min-height: 100vh;

}



/* =========================================
   TOP BAR
========================================= */

.topbar {

    position: sticky;

    top: 0;

    z-index: 20;

    height: 64px;

    display: flex;

    align-items: center;

    gap: 15px;

    padding: 0 24px;

    background: #111;

    color: #fff;

}


.back-button {

    width: 38px;

    height: 38px;

    border: 1px solid
        rgba(255,255,255,.2);

    border-radius: 50%;

    background: transparent;

    color: #fff;

    font-size: 21px;

}


.topbar-title {

    font-size: 15px;

    font-weight: 700;

}



/* =========================================
   HERO
========================================= */

.batch-hero {

    max-width: 1100px;

    margin: 30px auto;

    padding: 0 20px;

    display: grid;

    grid-template-columns:
        1.1fr
        1fr;

    gap: 35px;

    align-items: center;

}


.hero-image-wrapper {

    width: 100%;

    aspect-ratio: 16 / 9;

    overflow: hidden;

    border-radius: 18px;

    background: #eaeaea;

}


.hero-image {

    width: 100%;

    height: 100%;

    object-fit: cover;

}


.hero-content {

    padding: 10px 0;

}


.batch-tag {

    display: inline-block;

    padding: 6px 10px;

    margin-bottom: 13px;

    border-radius: 20px;

    background: #111;

    color: #fff;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 1px;

}


.hero-content h1 {

    font-size: 36px;

    line-height: 1.12;

    margin-bottom: 14px;

}


.short-description {

    color: #666;

    line-height: 1.7;

    font-size: 15px;

}


.price {

    margin-top: 22px;

    font-size: 25px;

    font-weight: 900;

}


.buy-button {

    width: 100%;

    height: 52px;

    margin-top: 20px;

    border: 0;

    border-radius: 10px;

    background: #111;

    color: #fff;

    font-size: 13px;

    font-weight: 800;

    letter-spacing: .7px;

}


.buy-button:hover {

    opacity: .88;

}



/* =========================================
   SECTIONS
========================================= */

.section {

    max-width: 1100px;

    margin: 0 auto;

    padding: 25px 20px;

}


.section h2 {

    font-size: 21px;

    margin-bottom: 16px;

}


.section-heading {

    display: flex;

    justify-content: space-between;

    align-items: center;

}


.section-heading p {

    color: #888;

    font-size: 12px;

}



/* =========================================
   DESCRIPTION
========================================= */

.description {

    padding: 22px;

    background: #fff;

    border: 1px solid #e6e6e6;

    border-radius: 14px;

    color: #555;

    line-height: 1.8;

    font-size: 14px;

    white-space: pre-line;

}



/* =========================================
   DETAILS
========================================= */

.details-grid {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

}


.detail-card {

    background: #fff;

    border: 1px solid #e6e6e6;

    border-radius: 12px;

    padding: 18px;

}


.detail-label {

    color: #999;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 1px;

    text-transform: uppercase;

}


.detail-value {

    margin-top: 7px;

    font-size: 14px;

    font-weight: 700;

}



/* =========================================
   FEATURES
========================================= */

.features-list {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;

}


.feature {

    padding: 15px;

    background: #fff;

    border: 1px solid #e6e6e6;

    border-radius: 10px;

    font-size: 13px;

}


.feature::before {

    content: "✓";

    margin-right: 9px;

    font-weight: 900;

}



/* =========================================
   SUBJECTS
========================================= */

.subjects-list {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;

}


.subject-card {

    background: #fff;

    border: 1px solid #e6e6e6;

    border-radius: 12px;

    padding: 17px;

    font-size: 14px;

    font-weight: 700;

}



/* =========================================
   BOTTOM BUY
========================================= */

.bottom-buy {

    position: sticky;

    bottom: 0;

    z-index: 15;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;

    padding: 16px 25px;

    background: #fff;

    border-top: 1px solid #ddd;

}


.bottom-buy div {

    display: flex;

    flex-direction: column;

    gap: 5px;

}


.bottom-buy span {

    color: #888;

    font-size: 11px;

}


.bottom-buy strong {

    font-size: 14px;

}


.bottom-buy button {

    min-width: 150px;

    height: 46px;

    padding: 0 20px;

    border: 0;

    border-radius: 9px;

    background: #111;

    color: #fff;

    font-size: 12px;

    font-weight: 800;

}



/* =========================================
   ERROR
========================================= */

.error-screen {

    min-height: 100vh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding: 30px;

    text-align: center;

}


.error-logo {

    font-size: 25px;

    font-weight: 900;

    letter-spacing: 3px;

}


.error-screen h2 {

    margin-top: 20px;

}


.error-screen p {

    margin-top: 8px;

    color: #777;

    font-size: 13px;

}


.error-screen button {

    margin-top: 20px;

    height: 44px;

    padding: 0 20px;

    border: 0;

    border-radius: 8px;

    background: #111;

    color: #fff;

    font-weight: 700;

}



/* =========================================
   MOBILE
========================================= */

@media (max-width: 750px) {

    .batch-hero {

        grid-template-columns: 1fr;

        margin-top: 20px;

        gap: 20px;

    }


    .hero-content h1 {

        font-size: 28px;

    }


    .details-grid {

        grid-template-columns:
            repeat(2, 1fr);

    }


    .features-list,
    .subjects-list {

        grid-template-columns: 1fr;

    }


    .bottom-buy {

        padding: 13px 16px;

    }


    .bottom-buy button {

        min-width: 120px;

    }

}


@media (max-width: 450px) {

    .details-grid {

        grid-template-columns: 1fr;

    }


    .bottom-buy strong {

        max-width: 160px;

        overflow: hidden;

        text-overflow: ellipsis;

        white-space: nowrap;

    }

}

    <script type="module">
import {
    auth,
    db
} from "../../firebase/firebase-config.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    doc,
    getDoc,
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* =========================================
   ELEMENTS
========================================= */

const loading =
    document.getElementById(
        "loading"
    );


const app =
    document.getElementById(
        "app"
    );


const errorScreen =
    document.getElementById(
        "error"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const backButton =
    document.getElementById(
        "backButton"
    );


const errorBack =
    document.getElementById(
        "errorBack"
    );


const batchImage =
    document.getElementById(
        "batchImage"
    );


const batchName =
    document.getElementById(
        "batchName"
    );


const batchTag =
    document.getElementById(
        "batchTag"
    );


const batchShortDescription =
    document.getElementById(
        "batchShortDescription"
    );


const batchPrice =
    document.getElementById(
        "batchPrice"
    );


const batchDescription =
    document.getElementById(
        "batchDescription"
    );


const detailsGrid =
    document.getElementById(
        "detailsGrid"
    );


const featuresSection =
    document.getElementById(
        "featuresSection"
    );


const featuresList =
    document.getElementById(
        "featuresList"
    );


const subjectsSection =
    document.getElementById(
        "subjectsSection"
    );


const subjectsList =
    document.getElementById(
        "subjectsList"
    );


const bottomBatchName =
    document.getElementById(
        "bottomBatchName"
    );


const buyButton =
    document.getElementById(
        "buyButton"
    );


const bottomBuyButton =
    document.getElementById(
        "bottomBuyButton"
    );



/* =========================================
   COURSE ID
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const courseId =
    params.get(
        "courseId"
    );



/* =========================================
   AUTH
========================================= */

onAuthStateChanged(
    auth,
    async user => {

        if (!user) {

            window.location.replace(
                "../../account/login/"
            );

            return;

        }


        if (!courseId) {

            showError(
                "No batch was selected."
            );

            return;

        }


        await loadBatch();

    }
);



/* =========================================
   LOAD BATCH
========================================= */

async function loadBatch() {

    try {

        const batchRef =
            doc(
                db,
                "zen2Courses",
                courseId
            );


        const snapshot =
            await getDoc(
                batchRef
            );


        if (!snapshot.exists()) {

            showError(
                "This batch does not exist."
            );

            return;

        }


        const batch =
            snapshot.data();


        renderBatch(
            batch
        );


        await loadSubjects();


        showApp();

    }

    catch (error) {

        console.error(
            "Batch details error:",
            error
        );


        showError(
            "Unable to load this batch."
        );

    }

}



/* =========================================
   RENDER BATCH
========================================= */

function renderBatch(
    batch
) {

    const name =
        batch.name ||
        batch.title ||
        batch.courseName ||
        batch.batchName ||
        "Zenova Batch";


    const image =
        batch.thumbnailUrl ||
        batch.imageUrl ||
        batch.thumbnail ||
        batch.bannerUrl ||
        "";


    const shortDescription =
        batch.shortDescription ||
        batch.tagline ||
        "";


    const description =
        batch.description ||
        batch.fullDescription ||
        batch.details ||
        "Batch information will be available soon.";


    const price =
        batch.price ??
        batch.fee ??
        batch.courseFee ??
        null;


    const tag =
        batch.tag ||
        batch.mode ||
        batch.medium ||
        "";



    /* IMAGE */

    if (image) {

        batchImage.src =
            image;

    }

    else {

        batchImage.style.display =
            "none";

    }



    /* NAME */

    batchName.textContent =
        name;


    bottomBatchName.textContent =
        name;



    /* SHORT DESCRIPTION */

    batchShortDescription.textContent =
        shortDescription;



    /* DESCRIPTION */

    batchDescription.textContent =
        description;



    /* PRICE */

    if (
        price !== null &&
        price !== undefined &&
        price !== ""
    ) {

        const numericPrice =
            Number(
                price
            );


        batchPrice.textContent =
            Number.isFinite(
                numericPrice
            )
                ? `₹${numericPrice.toLocaleString("en-IN")}`
                : `₹${price}`;

    }

    else {

        batchPrice.textContent =
            "";

    }



    /* TAG */

    if (tag) {

        batchTag.textContent =
            tag;

        batchTag.classList.remove(
            "hidden"
        );

    }



    /* DETAILS */

    renderDetails(
        batch
    );



    /* FEATURES */

    renderFeatures(
        batch
    );

}



/* =========================================
   DETAILS
========================================= */

function renderDetails(
    batch
) {

    const details = [];


    addDetail(
        details,
        "Class",
        batch.className ||
        batch.class ||
        batch.standard
    );


    addDetail(
        details,
        "Medium",
        batch.medium ||
        batch.language
    );


    addDetail(
        details,
        "Mode",
        batch.mode ||
        batch.batchMode
    );


    addDetail(
        details,
        "Duration",
        batch.duration ||
        batch.courseDuration
    );


    addDetail(
        details,
        "Faculty",
        batch.faculty ||
        batch.facultyName
    );


    addDetail(
        details,
        "Validity",
        batch.validity ||
        batch.accessValidity
    );


    detailsGrid.innerHTML =
        details
            .map(
                item => `

                    <div
                        class="detail-card"
                    >

                        <div
                            class="detail-label"
                        >
                            ${escapeHtml(
                                item.label
                            )}
                        </div>

                        <div
                            class="detail-value"
                        >
                            ${escapeHtml(
                                item.value
                            )}
                        </div>

                    </div>

                `
            )
            .join("");


}



/* =========================================
   ADD DETAIL
========================================= */

function addDetail(
    array,
    label,
    value
) {

    if (
        value === undefined ||
        value === null ||
        String(value).trim() === ""
    ) {

        return;

    }


    array.push({

        label,

        value:
            String(
                value
            )

    });

}



/* =========================================
   FEATURES
========================================= */

function renderFeatures(
    batch
) {

    let features =
        batch.features ||
        batch.benefits ||
        batch.inclusions ||
        [];


    if (
        typeof features ===
        "string"
    ) {

        features =
            features
                .split("\n")
                .map(
                    item =>
                        item.trim()
                )
                .filter(Boolean);

    }


    if (
        !Array.isArray(
            features
        ) ||
        !features.length
    ) {

        featuresSection.classList.add(
            "hidden"
        );

        return;

    }


    featuresSection.classList.remove(
        "hidden"
    );


    featuresList.innerHTML =
        features
            .map(
                feature => `

                    <div
                        class="feature"
                    >
                        ${escapeHtml(
                            typeof feature === "string"
                                ? feature
                                : feature.name ||
                                  feature.title ||
                                  ""
                        )}
                    </div>

                `
            )
            .join("");

}



/* =========================================
   SUBJECTS
========================================= */

async function loadSubjects() {

    try {

        const q =
            query(
                collection(
                    db,
                    "zen2Subjects"
                ),

                where(
                    "courseId",
                    "==",
                    courseId
                )
            );


        const snapshot =
            await getDocs(
                q
            );


        if (
            snapshot.empty
        ) {

            subjectsSection.classList.add(
                "hidden"
            );

            return;

        }


        subjectsSection.classList.remove(
            "hidden"
        );


        subjectsList.innerHTML =
            snapshot.docs
                .map(
                    item => {

                        const data =
                            item.data();


                        const name =
                            data.name ||
                            data.title ||
                            data.subjectName ||
                            data.subject ||
                            "Subject";


                        return `

                            <div
                                class="subject-card"
                            >

                                ${escapeHtml(
                                    name
                                )}

                            </div>

                        `;

                    }
                )
                .join("");

    }

    catch (error) {

        console.warn(
            "Unable to load subjects:",
            error
        );


        subjectsSection.classList.add(
            "hidden"
        );

    }

}



/* =========================================
   BUY NOW
========================================= */

function openPurchase() {

    /*
     * Purchase page will be connected
     * separately to the ZEN2 enrollment
     * system.
     */

    window.location.href =
        `../checkout/?courseId=${
            encodeURIComponent(
                courseId
            )
        }`;

}


buyButton.addEventListener(
    "click",
    openPurchase
);


bottomBuyButton.addEventListener(
    "click",
    openPurchase
);



/* =========================================
   BACK
========================================= */

backButton.addEventListener(
    "click",
    () => {

        if (
            window.history.length > 1
        ) {

            window.history.back();

            return;

        }


        window.location.href =
            "../";

    }
);


errorBack.addEventListener(
    "click",
    () => {

        window.history.back();

    }
);



/* =========================================
   SHOW APP
========================================= */

function showApp() {

    loading.classList.add(
        "hidden"
    );


    app.classList.remove(
        "hidden"
    );

}



/* =========================================
   ERROR
========================================= */

function showError(
    text
) {

    loading.classList.add(
        "hidden"
    );


    app.classList.add(
        "hidden"
    );


    errorMessage.textContent =
        text;


    errorScreen.classList.remove(
        "hidden"
    );

}



/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}
