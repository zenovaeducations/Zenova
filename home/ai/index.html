
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenova AI | Restricted Access</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background: #F7F9FC;
  color: #172338;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  height: 68px;
  padding: 0 22px;
  background: #FFFFFF;
  border-bottom: 1px solid #E7EDF5;
  display: flex;
  align-items: center;
  gap: 11px;
}

.logo {
  width: 38px;
  height: 38px;
  background: #3978E8;
  color: white;
  border-radius: 11px;
  display: grid;
  place-items: center;
  font-size: 22px;
}

.brand {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.brand span {
  color: #3978E8;
}

main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.card {
  background: white;
  border: 1px solid #E7EDF5;
  border-radius: 20px;
  padding: 38px 28px;
  width: 100%;
  max-width: 390px;
  text-align: center;
  box-shadow: 0 8px 35px rgba(28, 55, 95, 0.04);
}

.lock-icon {
  width: 68px;
  height: 68px;
  margin: 0 auto 22px;
  display: grid;
  place-items: center;
  background: #EAF2FF;
  color: #3978E8;
  border-radius: 20px;
  font-size: 31px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #FFF3E8;
  color: #B76519;
  padding: 7px 11px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 17px;
}

h1 {
  font-size: 23px;
  letter-spacing: -0.7px;
  margin-bottom: 12px;
}

.description {
  color: #7B8799;
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 24px;
}

.contact {
  display: flex;
  align-items: center;
  text-align: left;
  gap: 12px;
  background: #F7F9FC;
  border: 1px solid #E7EDF5;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 22px;
}

.contact i {
  color: #3978E8;
  font-size: 23px;
}

.contact strong {
  display: block;
  font-size: 13px;
  margin-bottom: 4px;
}

.contact small {
  color: #7B8799;
  font-size: 12px;
}

button {
  width: 100%;
  border: none;
  background: #3978E8;
  color: white;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  padding: 14px;
  border-radius: 11px;
  cursor: pointer;
}

button:hover {
  background: #245FC9;
}

footer {
  text-align: center;
  padding: 18px;
  color: #9AA5B5;
  font-size: 11px;
}

@media (max-width: 400px) {
  .card { padding: 30px 20px; }
  h1 { font-size: 21px; }
}
</style>
</head>

<body>

<header>
  <div class="logo"><i class="ri-graduation-cap-line"></i></div>
  <div class="brand">zenova <span>educations</span></div>
</header>

<main>
  <section class="card">
    <div class="lock-icon">
      <i class="ri-lock-2-line"></i>
    </div>

    <div class="badge">
      <i class="ri-shield-keyhole-line"></i>
      RESTRICTED ACCESS
    </div>

    <h1>Access Restricted</h1>

    <p class="description">
      You don't have permission to access Zenova AI.
      This page is available only to authorized users.
      Please contact the administrator to request access.
    </p>

    <div class="contact">
      <i class="ri-customer-service-2-line"></i>
      <div>
        <strong>Need access?</strong>
        <small>Contact the Zenova administrator</small>
      </div>
    </div>

    <button onclick="history.back()">
      <i class="ri-arrow-left-line"></i>
      Go Back
    </button>
  </section>
</main>

<footer>
  © 2026 Zenova Educations. All rights reserved.
</footer>

</body>
</html>
