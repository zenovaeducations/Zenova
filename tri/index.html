<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #0b1425;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.presentation {
    position: relative;
    width: min(100vw, 177.7778vh);
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: white;
}

.slide {
    position: absolute;
    inset: 0;
    display: none;
    overflow: hidden;
}

.slide.active {
    display: block;
}

.slide-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    z-index: 0;
}

/* COMMON BRANDING */

.brand {
    position: absolute;
    top: 4%;
    left: 4%;
    z-index: 2;
    color: #1763b8;
    font-size: clamp(14px, 2.1vw, 30px);
    font-weight: 800;
    letter-spacing: -1px;
}

.brand small {
    display: block;
    font-size: 0.3em;
    letter-spacing: 0.4em;
}

.subject-label {
    position: absolute;
    top: 15%;
    left: 4%;
    z-index: 2;
    color: #14264a;
    font-size: clamp(8px, 1vw, 14px);
    font-weight: bold;
    letter-spacing: 0.08em;
}

.page-number {
    position: absolute;
    right: 4%;
    top: 5%;
    z-index: 2;
    color: #17345c;
    font-size: clamp(11px, 1.4vw, 20px);
}

/* CONTENT AREA */

.content {
    position: absolute;
    z-index: 2;
    left: 4%;
    top: 25%;
    width: 43%;
    max-height: 68%;
    overflow: hidden;
    color: #172338;
}

.chapter-tag {
    display: inline-block;
    background: #1763b8;
    color: white;
    padding: 0.5em 0.9em;
    border-radius: 7px;
    font-size: clamp(9px, 1.1vw, 16px);
    font-weight: bold;
    margin-bottom: 3%;
}

.heading {
    font-family: Georgia, serif;
    font-size: clamp(25px, 4.5vw, 65px);
    line-height: 1.04;
    font-weight: bold;
    color: #14264a;
}

.kannada-heading {
    font-family: "Noto Sans Kannada", sans-serif;
    color: #632b88;
    font-size: clamp(18px, 2.7vw, 39px);
    font-weight: bold;
    line-height: 1.35;
    margin-top: 3%;
}

.blue-line {
    width: 65px;
    height: 4px;
    background: #1763b8;
    margin: 4% 0;
}

.description {
    font-size: clamp(9px, 1.15vw, 16px);
    line-height: 1.6;
    color: #263750;
}

.kannada-description {
    font-family: "Noto Sans Kannada", sans-serif;
    color: #632b88;
    font-size: clamp(9px, 1.1vw, 15px);
    line-height: 1.7;
    margin-top: 2%;
}

/* CONTENT CARDS FOR FUTURE SLIDES */

.content.wide {
    width: 52%;
    top: 20%;
    max-height: 75%;
}

.content.wide .heading {
    font-size: clamp(23px, 3.7vw, 53px);
}

.info-card {
    background: rgba(255,255,255,0.95);
    border: 1px solid #dce5ed;
    border-radius: 12px;
    padding: 3%;
    margin-top: 3%;
    box-shadow: 0 3px 12px rgba(30,60,100,0.06);
}

.info-card h3 {
    color: #245fc9;
    font-size: clamp(11px, 1.3vw, 18px);
    margin-bottom: 2%;
}

.info-card p,
.info-card li {
    color: #263750;
    font-size: clamp(8px, 1vw, 14px);
    line-height: 1.6;
}

.info-card ul {
    padding-left: 1.3em;
}

.kn {
    font-family: "Noto Sans Kannada", sans-serif;
    color: #632b88;
    margin-top: 2%;
}

/* NAVIGATION */

.controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 14px;
    background: rgba(12,22,40,0.94);
    border-radius: 40px;
    color: white;
}

.controls button {
    background: #3978e8;
    color: white;
    border: none;
    padding: 9px 15px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 13px;
}

.controls button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
}

#counter {
    font-size: 13px;
    white-space: nowrap;
}

body.fullscreen .controls {
    opacity: 0;
    transition: opacity .2s;
}

body.fullscreen .controls:hover {
    opacity: 1;
}

@media print {
    @page {
        size: 16in 9in;
        margin: 0;
    }

    body {
        display: block;
        background: white;
        overflow: visible;
    }

    .presentation {
        width: 16in;
        height: auto;
        aspect-ratio: auto;
        overflow: visible;
    }

    .slide,
    .slide.active {
        position: relative;
        display: block;
        width: 16in;
        height: 9in;
        break-after: page;
        page-break-after: always;
    }

    .controls {
        display: none;
    }
}
</style>

</main>


<!-- NAVIGATION CONTROLS -->

<div class="controls">

    <button id="prevBtn" onclick="previousSlide()">
        ← Previous
    </button>

    <span id="counter">1 / 1</span>

    <button id="nextBtn" onclick="nextSlide()">
        Next →
    </button>

    <button onclick="toggleFullscreen()">
        ⛶
    </button>

</div>


<script>

/* AUTOMATIC SLIDE DETECTION */

const slides = document.querySelectorAll(".slide");

let currentSlide = 0;

function showSlide(index) {

    if (index < 0 || index >= slides.length) return;

    slides.forEach(slide => {
        slide.classList.remove("active");
    });

    currentSlide = index;

    slides[currentSlide].classList.add("active");

    document.getElementById("counter").textContent =
        (currentSlide + 1) + " / " + slides.length;

    document.getElementById("prevBtn").disabled =
        currentSlide === 0;

    document.getElementById("nextBtn").disabled =
        currentSlide === slides.length - 1;
}

function nextSlide() {
    showSlide(currentSlide + 1);
}

function previousSlide() {
    showSlide(currentSlide - 1);
}

/* FULLSCREEN */

function toggleFullscreen() {

    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}

document.addEventListener("fullscreenchange", () => {
    document.body.classList.toggle(
        "fullscreen",
        !!document.fullscreenElement
    );
});

/* KEYBOARD CONTROLS */

document.addEventListener("keydown", event => {

    if (
        event.key === "ArrowRight" ||
        event.key === "PageDown"
    ) {
        nextSlide();
    }

    if (
        event.key === "ArrowLeft" ||
        event.key === "PageUp"
    ) {
        previousSlide();
    }

    if (event.key.toLowerCase() === "f") {
        toggleFullscreen();
    }

    if (event.key === "Home") {
        showSlide(0);
    }

    if (event.key === "End") {
        showSlide(slides.length - 1);
    }
});

/* INITIALIZE */

showSlide(0);

</script>
