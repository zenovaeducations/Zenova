<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chapters | Zenova Educations</title>

  <link rel="stylesheet" href="./chapter.css">
</head>

<body>

  <!-- =========================================================
       ZENOVA LOADING SCREEN
  ========================================================== -->
  <div id="loadingScreen" class="loading-screen">
    <div class="loading-logo">Z</div>
    <div class="loading-ring"></div>
  </div>


  <!-- =========================================================
       MAIN APP
  ========================================================== -->
  <main id="app" class="app hidden">

    <!-- TOP HEADER -->
    <header class="top-header">

      <button id="backBtn" class="icon-btn" aria-label="Go back">
        ←
      </button>

      <div class="header-title">
        <span class="header-brand">ZENOVA</span>
        <span class="header-subtitle">EDUCATIONS</span>
      </div>

      <div class="header-spacer"></div>

    </header>


    <!-- =======================================================
         SUBJECT INFORMATION
    ======================================================== -->
    <section class="subject-hero">

      <div class="eyebrow">SUBJECT</div>

      <h1 id="subjectName">Loading...</h1>

      <p id="subjectDescription">
        Loading chapters...
      </p>

    </section>


    <!-- =======================================================
         CHAPTERS
    ======================================================== -->
    <section class="chapters-section">

      <div class="section-heading">
        <div>
          <span class="eyebrow">RECORDED CLASSES</span>
          <h2>Chapters</h2>
        </div>

        <span id="chapterCount" class="chapter-count"></span>
      </div>


      <!-- REAL FIREBASE CONTENT GOES HERE -->
      <div id="chaptersContainer" class="chapters-container"></div>


      <!-- EMPTY STATE -->
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">—</div>
        <h3>No chapters available</h3>
        <p>
          Chapters for this subject haven't been added yet.
        </p>
      </div>


    </section>

  </main>


  <!-- =========================================================
       JAVASCRIPT
  ========================================================== -->
  <script type="module" src="./chapter-core-X7kP.js"></script>

</body>
</html>
