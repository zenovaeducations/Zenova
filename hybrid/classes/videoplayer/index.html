<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Video — Zenova</title>

  <link
    rel="stylesheet"
    href="./videoplayer.css"
  >
</head>

<body>

  <!-- LOADING -->

  <div id="loadingScreen">

    <div class="loader-ring">
      <span>Z</span>
    </div>

  </div>


  <!-- APP -->

  <div id="app" class="hidden">

    <header class="topbar">

      <button
        id="backBtn"
        class="back-btn"
      >
        ← Back
      </button>

      <div class="brand">
        ZENOVA
      </div>

      <div class="topbar-spacer"></div>

    </header>


    <main>

      <!-- VIDEO -->

      <section class="player-section">

        <div
          id="playerContainer"
          class="player-container"
        >

          <div
            id="playerLoading"
            class="player-loading"
          >
            Loading video...
          </div>

          <iframe
            id="videoPlayer"
            class="video-player hidden"
            title="Zenova Video Player"
            allow="
              accelerometer;
              autoplay;
              clipboard-write;
              encrypted-media;
              gyroscope;
              picture-in-picture;
              web-share
            "
            allowfullscreen
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>

        </div>

      </section>


      <!-- VIDEO INFORMATION -->

      <section class="video-info-section">

        <div class="video-label">
          REVISION CLASS
        </div>

        <h1 id="videoTitle">
          Video
        </h1>


        <div class="meta-row">

          <span id="subjectName">
            Subject
          </span>

          <span class="meta-dot">
            •
          </span>

          <span id="chapterName">
            Chapter
          </span>

        </div>


        <div
          id="teacherName"
          class="teacher"
        >
        </div>


        <!-- ACTIONS -->

        <div class="actions">

          <button
            id="askDoubtBtn"
            class="action-btn"
          >
            Ask Doubt
          </button>

          <button
            id="shareBtn"
            class="action-btn"
          >
            Share
          </button>

          <button
            id="saveBtn"
            class="action-btn"
          >
            Save Video
          </button>

        </div>


        <!-- DESCRIPTION -->

        <div
          id="descriptionSection"
          class="description-section hidden"
        >

          <h2>
            About this class
          </h2>

          <p id="videoDescription"></p>

        </div>

      </section>


      <!-- ERROR -->

      <section
        id="errorState"
        class="error hidden"
      >
      </section>

    </main>

  </div>


  <script
    type="module"
    src="./videoplayer-core.js"
  ></script>

</body>
</html>
