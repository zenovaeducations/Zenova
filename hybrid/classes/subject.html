<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Subject | Zenova Educations</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css"
    >

    <link rel="stylesheet" href="./subject.css">
</head>

<body>

<!-- =========================================================
     LOADER
========================================================= -->

<div id="loader" class="loader-screen">

    <div class="loader-z">Z</div>

    <div class="loader-ring"></div>

</div>


<!-- =========================================================
     APP
========================================================= -->

<div id="app" class="app hidden">

    <!-- HEADER -->

    <header class="topbar">

        <button
            id="backButton"
            class="back-button"
            type="button"
            aria-label="Go back"
        >
            <i class="ri-arrow-left-line"></i>
        </button>

        <div class="brand">
            <span class="brand-name">ZENOVA</span>
            <span class="brand-sub">EDUCATIONS</span>
        </div>

        <div class="header-spacer"></div>

    </header>


    <!-- SUBJECT HERO -->

    <main class="page">

        <section class="subject-header">

            <div class="subject-label">
                RECORDED CLASSES
            </div>

            <h1 id="subjectName">
                Subject
            </h1>

            <p id="subjectDescription">
                Recorded chapters and study material.
            </p>

            <div class="subject-meta">

                <span>
                    <i class="ri-book-open-line"></i>
                    <span id="chapterCount">0</span> Chapters
                </span>

                <span id="mediumBadge" class="medium-badge">
                    —
                </span>

            </div>

        </section>


        <!-- CHAPTERS -->

        <section class="chapters-section">

            <div class="section-heading">

                <div>
                    <span>COURSE CONTENT</span>
                    <h2>Chapters</h2>
                </div>

            </div>


            <div
                id="chaptersList"
                class="chapters-list"
            ></div>


            <!-- EMPTY -->

            <div
                id="emptyState"
                class="empty-state hidden"
            >

                <div class="empty-icon">
                    <i class="ri-book-open-line"></i>
                </div>

                <h3>No chapters available</h3>

                <p>
                    Chapters for this subject have not been uploaded yet.
                </p>

            </div>


            <!-- ERROR -->

            <div
                id="errorState"
                class="error-state hidden"
            >

                <div class="error-icon">
                    <i class="ri-error-warning-line"></i>
                </div>

                <h3>Unable to load chapters</h3>

                <p id="errorMessage">
                    Please try again.
                </p>

                <button
                    id="retryButton"
                    type="button"
                >
                    Try Again
                </button>

            </div>

        </section>

    </main>

</div>


<!-- =========================================================
     SCRIPT
========================================================= -->

<script
    type="module"
    src="./subject-core-X7kP.js"
></script>

</body>
</html>
