<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Classes | Zenova</title>

    <link rel="stylesheet" href="./classes.css">
</head>

<body>

<div id="loader" class="loader-screen">
    <div class="loader-z">Z</div>
</div>

<div id="app" class="app hidden">

    <header class="topbar">

        <button class="icon-btn" id="backBtn" aria-label="Go back">
            <span class="back-arrow">‹</span>
        </button>

        <div class="brand">
            <div class="brand-name">ZENOVA</div>
            <div class="brand-sub">CLASSES</div>
        </div>

        <button class="icon-btn notification-btn" id="notificationBtn">
            <span class="bell-icon"></span>
        </button>

    </header>


    <main class="page">

        <section class="intro">

            <div>
                <p class="eyebrow">RECORDED LEARNING</p>

                <h1>Classes</h1>

                <p class="intro-text">
                    Learn chapter by chapter at your own pace.
                </p>
            </div>

            <div class="medium-pill">
                <span class="medium-dot"></span>
                <span id="mediumLabel">Kannada Medium</span>
            </div>

        </section>


        <section class="subjects-section">

            <div class="section-heading">
                <div>
                    <h2>Subjects</h2>
                    <p>Select a subject to continue learning.</p>
                </div>
            </div>

            <div id="subjectsGrid" class="subjects-grid"></div>

            <div id="emptyState" class="empty-state hidden">

                <div class="empty-mark">Z</div>

                <h3>No recorded classes yet</h3>

                <p>
                    Recorded classes for your class and medium
                    will appear here.
                </p>

            </div>

            <div id="errorState" class="error-state hidden">

                <h3>Couldn't load Classes</h3>

                <p id="errorText">
                    Please try again.
                </p>

                <button id="retryBtn" class="retry-btn">
                    Try Again
                </button>

            </div>

        </section>

    </main>

</div>


<script type="module" src="./classes-core-X7kP.js"></script>

</body>
</html>
