<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Zenova Hybrid</title>

    <link
        rel="stylesheet"
        href="./hybrid.css"
    >

</head>


<body>

    <!-- =====================================================
         LOADING SCREEN
    ====================================================== -->

    <div
        id="zenovaLoader"
        class="zenova-loader"
    >

        <div class="loader-ring">

            <span>Z</span>

        </div>

    </div>


    <!-- =====================================================
         APPLICATION
    ====================================================== -->

    <div
        id="hybridApp"
        class="hybrid-app hidden"
    >


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="topbar">

            <div class="brand">

                <div class="brand-logo">
                    Z
                </div>

                <div class="brand-text">

                    <strong>
                        ZENOVA
                    </strong>

                    <span>
                        HYBRID
                    </span>

                </div>

            </div>


            <button
                id="notificationButton"
                class="icon-button"
                type="button"
                aria-label="Notifications"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >

                    <path
                        d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
                    />

                    <path
                        d="M10 21h4"
                    />

                </svg>

                <span
                    id="notificationDot"
                    class="notification-dot hidden"
                ></span>

            </button>

        </header>



        <!-- =================================================
             GREETING
        ================================================== -->

        <section class="welcome">

            <div>

                <p class="eyebrow">
                    HYBRID PROGRAM
                </p>

                <h1>
                    Good morning,
                    <span id="studentName">
                        Student
                    </span>
                </h1>

                <p
                    id="studentMeta"
                    class="student-meta"
                >
                    Loading student profile...
                </p>

            </div>


            <button
                id="profileButton"
                class="profile-avatar"
                type="button"
            >
                S
            </button>

        </section>



        <!-- =================================================
             HERO BANNER
        ================================================== -->

        <section
            id="bannerSection"
            class="hero-section hidden"
        >

            <div
                id="bannerSlider"
                class="banner-slider"
            ></div>


            <div class="banner-bottom">

                <div
                    id="bannerDots"
                    class="banner-dots"
                ></div>

                <span
                    id="bannerCounter"
                    class="banner-counter"
                >
                    00 / 00
                </span>

            </div>

        </section>



        <!-- =================================================
             TODAY MASTER PLAN
        ================================================== -->

        <section
            id="masterPlanSection"
            class="section"
        >

            <div class="section-heading">

                <div>

                    <p class="section-label">
                        TODAY
                    </p>

                    <h2>
                        Master Plan
                    </h2>

                </div>


                <div
                    id="masterProgressText"
                    class="progress-text"
                >
                    0 / 0
                </div>

            </div>


            <div class="progress-track">

                <div
                    id="masterProgress"
                    class="progress-value"
                ></div>

            </div>


            <div
                id="masterPlanList"
                class="master-plan"
            ></div>

        </section>



        <!-- =================================================
             QUICK ACCESS
        ================================================== -->

        <section class="section">

            <div class="section-heading">

                <div>

                    <p class="section-label">
                        SHORTCUTS
                    </p>

                    <h2>
                        Quick Access
                    </h2>

                </div>

            </div>


            <div class="quick-grid">


                <button
                    class="quick-card"
                    data-route="classes"
                    type="button"
                >

                    <div class="quick-icon">
                        ▶
                    </div>

                    <span>
                        Classes
                    </span>

                </button>



                <button
                    class="quick-card"
                    data-route="study"
                    type="button"
                >

                    <div class="quick-icon">
                        ◫
                    </div>

                    <span>
                        Study
                    </span>

                </button>



                <button
                    class="quick-card"
                    data-route="timetable"
                    type="button"
                >

                    <div class="quick-icon">
                        □
                    </div>

                    <span>
                        Timetable
                    </span>

                </button>



                <button
                    class="quick-card"
                    data-route="attendance"
                    type="button"
                >

                    <div class="quick-icon">
                        %
                    </div>

                    <span>
                        Attendance
                    </span>

                </button>



                <button
                    class="quick-card"
                    data-route="tests"
                    type="button"
                >

                    <div class="quick-icon">
                        ✓
                    </div>

                    <span>
                        Tests
                    </span>

                </button>



                <button
                    class="quick-card"
                    data-route="more"
                    type="button"
                >

                    <div class="quick-icon">
                        +
                    </div>

                    <span>
                        More
                    </span>

                </button>


            </div>

        </section>



        <!-- =================================================
             TODAY'S CLASSES
        ================================================== -->

        <section
            id="classesSection"
            class="section hidden"
        >

            <div class="section-heading">

                <div>

                    <p class="section-label">
                        UP NEXT
                    </p>

                    <h2>
                        Today's Classes
                    </h2>

                </div>


                <button
                    class="text-button"
                    data-route="classes"
                    type="button"
                >
                    View all
                </button>

            </div>


            <div
                id="classesList"
                class="content-list"
            ></div>

        </section>



        <!-- =================================================
             CONTINUE LEARNING
        ================================================== -->

        <section
            id="learningSection"
            class="section hidden"
        >

            <div class="section-heading">

                <div>

                    <p class="section-label">
                        KEEP GOING
                    </p>

                    <h2>
                        Continue Learning
                    </h2>

                </div>


                <button
                    class="text-button"
                    data-route="study"
                    type="button"
                >
                    Study
                </button>

            </div>


            <div
                id="learningList"
                class="learning-list"
            ></div>

        </section>



        <!-- =================================================
             ANNOUNCEMENTS
        ================================================== -->

        <section
            id="announcementSection"
            class="section hidden"
        >

            <div class="section-heading">

                <div>

                    <p class="section-label">
                        UPDATES
                    </p>

                    <h2>
                        Announcements
                    </h2>

                </div>


                <button
                    class="text-button"
                    data-route="more"
                    type="button"
                >
                    View all
                </button>

            </div>


            <div
                id="announcementList"
                class="announcement-list"
            ></div>

        </section>



        <!-- =================================================
             BOTTOM NAVIGATION
        ================================================== -->

        <div class="bottom-space"></div>


        <nav class="bottom-nav">


            <button
                class="nav-item active"
                data-route="home"
                type="button"
            >

                <span>
                    ⌂
                </span>

                <small>
                    Home
                </small>

            </button>



            <button
                class="nav-item"
                data-route="classes"
                type="button"
            >

                <span>
                    ▶
                </span>

                <small>
                    Classes
                </small>

            </button>



            <button
                class="nav-item"
                data-route="study"
                type="button"
            >

                <span>
                    ◫
                </span>

                <small>
                    Study
                </small>

            </button>



            <button
                class="nav-item"
                data-route="timetable"
                type="button"
            >

                <span>
                    □
                </span>

                <small>
                    Schedule
                </small>

            </button>



            <button
                class="nav-item"
                data-route="more"
                type="button"
            >

                <span>
                    •••
                </span>

                <small>
                    More
                </small>

            </button>


        </nav>

    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        type="module"
        src="./hybrid-core-X7kP.js"
    ></script>

</body>

</html>
