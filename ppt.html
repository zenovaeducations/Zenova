
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenova Educations | Slide 01</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, Helvetica, sans-serif;
}

/* 16:9 PRESENTATION CANVAS */

.slide {
    position: absolute;
    width: min(100vw, 177.7778vh);
    height: min(100vh, 56.25vw);
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    aspect-ratio: 16 / 9;
    overflow: hidden;

    background-image: url("1.png");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
    color: #10243e;
}

/* BRAND */

.brand {
    position: absolute;
    top: 5%;
    left: 4.2%;
}

.brand h2 {
    font-size: clamp(15px, 2.2vw, 38px);
    font-weight: 800;
    letter-spacing: 1px;
    color: #205b9d;
}

.brand p {
    font-size: clamp(7px, 0.85vw, 15px);
    letter-spacing: 5px;
    color: #52647a;
    margin-top: 2px;
}

/* COURSE DETAILS */

.course {
    position: absolute;
    top: 14.5%;
    left: 4.2%;
    font-size: clamp(8px, 1.1vw, 19px);
    letter-spacing: 2px;
    color: #536174;
}

/* CHAPTER LABEL */

.chapter {
    position: absolute;
    top: 24%;
    left: 4.4%;
    background: #3978c7;
    color: white;
    padding: 0.55% 1.1%;
    font-size: clamp(9px, 1.3vw, 22px);
    font-weight: 700;
    letter-spacing: 4px;
}

/* MAIN TITLE */

.heading {
    position: absolute;
    left: 4.2%;
    top: 30.5%;
    width: 44%;
}

.heading h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(35px, 6.6vw, 108px);
    line-height: 0.99;
    font-weight: 700;
    letter-spacing: -3px;
    color: #102744;
}

/* SMALL BLUE DIVIDER */

.line {
    position: absolute;
    left: 4.4%;
    top: 69.8%;
    width: 5.2%;
    height: 4px;
    background: #3978c7;
}

/* CHAPTER TOPICS */

.topics {
    position: absolute;
    left: 4.4%;
    top: 73.5%;
    font-size: clamp(7px, 1.05vw, 17px);
    letter-spacing: 2px;
    color: #59616b;
    white-space: nowrap;
}

/* SLIDE NUMBER */

.slide-number {
    position: absolute;
    top: 4.5%;
    right: 4%;
    font-size: clamp(12px, 1.7vw, 27px);
    color: #173451;
    font-weight: 400;
    letter-spacing: 1px;
}

</style>
</head>

<body>

<main class="slide">

    <header class="brand">
        <h2>ZENOVA</h2>
        <p>EDUCATIONS</p>
    </header>

    <div class="course">
        SSLC 2026–27 &nbsp; | &nbsp;
        SOCIAL SCIENCE &nbsp; | &nbsp;
        HISTORY
    </div>

    <div class="chapter">
        CHAPTER 1 – PART 2
    </div>

    <section class="heading">
        <h1>
            The First<br>
            War of Indian<br>
            Independence
        </h1>
    </section>

    <div class="line"></div>

    <div class="topics">
        CAUSES &nbsp; | &nbsp;
        COURSE &nbsp; | &nbsp;
        LEADERS &nbsp; | &nbsp;
        RESULTS &nbsp; | &nbsp;
        SIGNIFICANCE
    </div>

    <div class="slide-number">
        01 / 12
    </div>

</main>

</body>
</html>
