
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zenova Educations | Slide 01</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #e9edf2;
}

/* 16:9 PRESENTATION CANVAS */

.slide {
    position: absolute;
    width: min(100vw, 177.7778vh);
    height: min(100vh, 56.25vw);

    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    aspect-ratio: 16 / 9;
    overflow: hidden;

    background-image: url("1.png");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;

    container-type: inline-size;
}

/* ZENOVA BRAND */

.brand {
    position: absolute;
    left: 4.2%;
    top: 4.7%;

    color: #15539a;
    font-family: Arial, sans-serif;
}

.brand-main {
    font-size: 2.15cqw;
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: 1;
}

.brand-sub {
    margin-top: 0.35cqw;
    font-size: 0.72cqw;
    letter-spacing: 0.48em;
    font-weight: 500;
}

/* SUBJECT LINE */

.course-info {
    position: absolute;
    left: 4.2%;
    top: 14.3%;

    color: #34465f;

    font-family: Arial, sans-serif;
    font-size: 1.08cqw;
    font-weight: 400;
    letter-spacing: 0.115em;
}

/* SLIDE NUMBER */

.slide-number {
    position: absolute;
    right: 4.1%;
    top: 4.8%;

    color: #142d4b;

    font-family: Arial, sans-serif;
    font-size: 1.45cqw;
    font-weight: 400;
    letter-spacing: 0.02em;
}

/* CHAPTER BADGE */

.chapter-label {
    position: absolute;
    left: 4.4%;
    top: 23.5%;

    background: #286bc1;
    color: #ffffff;

    padding: 0.48cqw 1.05cqw;

    font-family: Arial, sans-serif;
    font-size: 1.27cqw;
    font-weight: 700;
    letter-spacing: 0.18em;
    line-height: 1.15;
}

/* MAIN TITLE */

.main-title {
    position: absolute;
    left: 4.1%;
    top: 30.2%;

    width: 43%;

    color: #102744;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 6.65cqw;
    font-weight: 700;
    line-height: 0.94;
    letter-spacing: -0.065em;
}

/* BLUE LINE */

.title-line {
    position: absolute;
    left: 4.45%;
    top: 67.8%;

    width: 5.2%;
    height: 0.42%;

    background: #286bc1;
}

/* BOTTOM KEYWORDS */

.topics {
    position: absolute;
    left: 4.45%;
    top: 71.7%;

    color: #555e69;

    font-family: Arial, sans-serif;
    font-size: 1.02cqw;
    font-weight: 400;
    letter-spacing: 0.105em;
    white-space: nowrap;
}

/* FULLSCREEN SUPPORT */

@media (display-mode: fullscreen) {
    .slide {
        width: 100vw;
        height: 56.25vw;
        max-height: 100vh;
    }
}
</style>
</head>

<body>

<main class="slide">

    <!-- BRAND -->
    <header class="brand">
        <div class="brand-main">ZENOVA</div>
        <div class="brand-sub">EDUCATIONS</div>
    </header>

    <!-- COURSE -->
    <div class="course-info">
        SSLC 2026–27 &nbsp; | &nbsp;
        SOCIAL SCIENCE &nbsp; | &nbsp;
        HISTORY
    </div>

    <!-- PAGE NUMBER -->
    <div class="slide-number">
        01 / 12
    </div>

    <!-- CHAPTER -->
    <div class="chapter-label">
        CHAPTER 1 – PART 2
    </div>

    <!-- TITLE -->
    <h1 class="main-title">
        The First<br>
        War of Indian<br>
        Independence
    </h1>

    <!-- ACCENT -->
    <div class="title-line"></div>

    <!-- TOPICS -->
    <div class="topics">
        CAUSES &nbsp; | &nbsp;
        COURSE &nbsp; | &nbsp;
        LEADERS &nbsp; | &nbsp;
        RESULTS &nbsp; | &nbsp;
        SIGNIFICANCE
    </div>

</main>

</body>
</html>
