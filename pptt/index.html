
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zenova Educations | Geography Chapter 25</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #0b1425;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* MAIN PRESENTATION */

.presentation {
    position: relative;
    width: min(100vw, 177.7778vh);
    aspect-ratio: 16 / 9;
    background: #ffffff;
    overflow: hidden;
    box-shadow: 0 15px 60px rgba(0,0,0,0.35);
}

/* SLIDES */

.slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
    overflow: hidden;
    background: #ffffff;
}

.slide.active {
    display: block;
}

/* IMAGE FILLS SLIDE WITHOUT CROPPING */

.slide img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    user-select: none;
    -webkit-user-drag: none;
}

/* CONTROL BAR */

.controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 15px;
    background: rgba(12, 22, 40, 0.9);
    color: #ffffff;
    padding: 10px 18px;
    border-radius: 50px;
    z-index: 100;
    transition: opacity 0.25s ease;
}

.controls button {
    background: #3978e8;
    color: #ffffff;
    border: none;
    padding: 9px 17px;
    border-radius: 30px;
    font-size: 14px;
    cursor: pointer;
}

.controls button:hover {
    background: #245fc9;
}

.controls button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

#counter {
    font-size: 14px;
    white-space: nowrap;
}

/* FULLSCREEN */

body.fullscreen-mode .presentation {
    width: min(100vw, 177.7778vh);
    max-height: 100vh;
}

body.fullscreen-mode .controls {
    opacity: 0;
}

body.fullscreen-mode .controls:hover {
    opacity: 1;
}

/* MOBILE */

@media (max-width: 600px) {
    .controls {
        bottom: 12px;
        gap: 8px;
        padding: 8px 12px;
    }

    .controls button {
        padding: 8px 12px;
        font-size: 12px;
    }

    #counter {
        font-size: 12px;
    }
}

@media print {
    @page {
        size: 16in 9in;
        margin: 0;
    }

    html, body {
        width: 16in;
        height: auto;
        overflow: visible;
        background: white;
    }

    .presentation {
        width: 16in;
        height: auto;
        aspect-ratio: auto;
        box-shadow: none;
        overflow: visible;
        display: block;
    }

    .slide,
    .slide.active {
        position: relative;
        display: block;
        width: 16in;
        height: 9in;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .controls {
        display: none;
    }
}
</style>
</head>

<body>

<!-- PRESENTATION -->

<main class="presentation" id="presentation">

    <!-- SLIDE 1 -->
    <section class="slide active">
        <img
            src="1.png"
            alt="Chapter 25 - India Land Use and Agriculture"
            draggable="false"
        >
    </section>

    <!-- SLIDE 2 -->
    <section class="slide">
        <img
            src="2.png"
            alt="Meaning and Factors Affecting Land Use"
            draggable="false"
        >
    </section>

    <!-- SLIDE 3 -->
    <section class="slide">
        <img
            src="3.png"
            alt="Types of Land Use - Net Sown Area and Forest Land"
            draggable="false"
        >
    </section>

</main>

<!-- NAVIGATION -->

<div class="controls" id="controls">

    <button id="prevBtn" onclick="previousSlide()">
        &#8592; Previous
    </button>

    <span id="counter">1 / 3</span>

    <button id="nextBtn" onclick="nextSlide()">
        Next &#8594;
    </button>

    <button onclick="toggleFullscreen()" title="Fullscreen">
        &#9974;
    </button>

</div>

<script>

const slides = document.querySelectorAll(".slide");

let currentSlide = 0;

function showSlide(index) {

    if (index < 0 || index >= slides.length) {
        return;
    }

    slides.forEach(slide => {
        slide.classList.remove("active");
    });

    currentSlide = index;

    slides[currentSlide].classList.add("active");

    document.getElementById("counter").textContent =
        (currentSlide + 1) + " / " + slides.length;

    document.getElementById("prevBtn").disabled =
        currentSlide === 0;

    document.getElementById("nextBtn").disabled =
        currentSlide === slides.length - 1;
}

function nextSlide() {
    showSlide(currentSlide + 1);
}

function previousSlide() {
    showSlide(currentSlide - 1);
}

/* KEYBOARD CONTROLS */

document.addEventListener("keydown", function(event) {

    if (
        event.key === "ArrowRight" ||
        event.key === "PageDown" ||
        event.key === " "
    ) {
        event.preventDefault();
        nextSlide();
    }

    if (
        event.key === "ArrowLeft" ||
        event.key === "PageUp"
    ) {
        event.preventDefault();
        previousSlide();
    }

    if (event.key.toLowerCase() === "f") {
        toggleFullscreen();
    }

    if (event.key === "Home") {
        showSlide(0);
    }

    if (event.key === "End") {
        showSlide(slides.length - 1);
    }
});

/* FULLSCREEN */

function toggleFullscreen() {

    if (!document.fullscreenElement) {

        document.documentElement.requestFullscreen()
            .catch(error => {
                console.error("Fullscreen error:", error);
            });

    } else {

        document.exitFullscreen();
    }
}

document.addEventListener("fullscreenchange", function() {

    document.body.classList.toggle(
        "fullscreen-mode",
        !!document.fullscreenElement
    );
});

/* TOUCH SWIPE */

let touchStartX = 0;

document.addEventListener("touchstart", function(event) {
    touchStartX = event.changedTouches[0].screenX;
}, { passive: true });

document.addEventListener("touchend", function(event) {

    const touchEndX = event.changedTouches[0].screenX;
    const difference = touchStartX - touchEndX;

    if (Math.abs(difference) > 60) {

        if (difference > 0) {
            nextSlide();
        } else {
            previousSlide();
        }
    }

}, { passive: true });

/* INITIALIZE */

showSlide(0);

</script>

</body>
</html>
