<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | Zenova Educations</title>

  <link
    rel="stylesheet"
    href="login.css"
  >

</head>


<body>


  <!-- LOADER -->

  <div
    id="loader"
    class="loader-screen"
  >

    <div class="loader-ring"></div>

    <div class="loader-logo">
      Z
    </div>

  </div>



  <!-- LOGIN -->

  <main class="page">

    <div class="login-card">


      <!-- LOGO -->

      <img
        src="../logo.png"
        class="logo"
        alt="Zenova Educations"
      >


      <h1>
        Welcome to Zenova
      </h1>


      <p class="subtitle">
        Enter your mobile number to continue to your student portal.
      </p>



      <!-- PHONE STEP -->

      <section id="phoneStep">


        <label
          for="phone"
          class="label"
        >
          Mobile number
        </label>


        <div class="phone-box">

          <div class="country-code">
            +91
          </div>

          <input
            type="tel"
            id="phone"
            maxlength="10"
            inputmode="numeric"
            placeholder="Enter mobile number"
            autocomplete="tel"
          >

        </div>


        <button
          id="searchBtn"
          class="primary-btn"
        >
          Continue
        </button>


        <div
          id="errorBox"
          class="error-box"
        ></div>


      </section>



      <!-- CRM RESULT -->

      <section
        id="resultStep"
        class="hidden"
      >


        <div
          id="resultIcon"
          class="result-icon"
        >
          ✓
        </div>


        <h2 id="resultTitle">
          We found your account
        </h2>


        <p
          id="resultMessage"
          class="result-message"
        ></p>


        <div
          id="crmInfo"
          class="crm-info"
        >

          <div class="crm-label">
            Name
          </div>

          <div
            id="crmName"
            class="crm-name"
          ></div>

        </div>



        <!-- EXISTING CRM -->

        <div
          id="existingActions"
          class="actions hidden"
        >

          <button
            id="yesBtn"
            class="primary-btn"
          >
            Yes, this is me
          </button>


          <button
            id="noBtn"
            class="secondary-btn"
          >
            No, create a new account
          </button>

        </div>



        <!-- NEW ACCOUNT -->

        <div
          id="newActions"
          class="actions hidden"
        >

          <button
            id="createBtn"
            class="primary-btn"
          >
            Create new account
          </button>

        </div>


      </section>


    </div>



    <footer>
      © Zenova Educations
    </footer>


  </main>



  <script
    type="module"
    src="login.js"
  ></script>


</body>

</html>
