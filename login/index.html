<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Zenova Educations</title>

    <link
        rel="stylesheet"
        href="./login.css"
    >

</head>


<body>

    <main class="page">

        <div class="login-card">

            <img
                src="../logo.png"
                class="logo"
                alt="Zenova Educations"
            >


            <h1>
                Welcome to Zenova
            </h1>


            <p class="subtitle">
                Your 10th Standard learning journey starts here.
            </p>


            <button
                type="button"
                id="googleBtn"
                class="google-btn"
            >

                <span class="google-icon">
                    G
                </span>

                <span id="googleBtnText">
                    Continue with Google
                </span>

            </button>


            <div
                id="errorBox"
                class="error-box"
            ></div>


            <p class="terms">
                By continuing, you agree to use your Google
                account to access Zenova Educations.
            </p>

        </div>


        <footer>
            © Zenova Educations
        </footer>

    </main>


    <script
        type="module"
        src="./login.js"
    ></script>

</body>

</html>
