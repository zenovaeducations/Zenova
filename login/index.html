<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Login • Zenova Educations</title>

    <link rel="stylesheet" href="./login.css">
</head>

<body>

    <main class="login-page">

        <section class="login-container">

            <!-- Logo -->
            <div class="brand">
                <img
                    src="../logo.png"
                    alt="Zenova Educations"
                    class="brand-logo"
                >
            </div>
<div id="recaptcha-container"></div>
            <!-- Phone Step -->
            <section
                id="phoneStep"
                class="login-step active"
            >

                <h1>Welcome to Zenova</h1>

                <p class="subtitle">
                    Enter your mobile number to continue to your student portal.
                </p>

                <label for="phoneNumber">
                    Mobile number
                </label>

                <div class="phone-input">

                    <span class="country-code">
                        +91
                    </span>

                    <input
                        id="phoneNumber"
                        type="tel"
                        inputmode="numeric"
                        autocomplete="tel"
                        maxlength="10"
                        placeholder="Enter mobile number"
                    >

                </div>

                <button
                    id="sendOtpBtn"
                    class="primary-button"
                    type="button"
                >
                    Continue
                </button>

                <!-- Invisible reCAPTCHA container -->
                <div id="recaptcha-container"></div>

                <p
                    id="phoneMessage"
                    class="message"
                ></p>

            </section>


            <!-- OTP Step -->
            <section
                id="otpStep"
                class="login-step"
            >

                <button
                    id="backToPhoneBtn"
                    class="back-button"
                    type="button"
                    aria-label="Back"
                >
                    <span>←</span>
                </button>

                <h1>Verify your number</h1>

                <p class="subtitle">
                    Enter the 6-digit OTP sent to
                    <strong id="displayPhone"></strong>
                </p>

                <label for="otp">
                    Verification code
                </label>

                <input
                    id="otp"
                    class="otp-input"
                    type="text"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    maxlength="6"
                    placeholder="000000"
                >

                <button
                    id="verifyOtpBtn"
                    class="primary-button"
                    type="button"
                >
                    Verify & Continue
                </button>

                <button
                    id="resendOtpBtn"
                    class="secondary-button"
                    type="button"
                >
                    Resend OTP
                </button>

                <p
                    id="otpMessage"
                    class="message"
                ></p>

            </section>


            <!-- Loading -->
            <div
                id="loginLoading"
                class="login-loading"
            >

                <div class="loading-ring"></div>

                <img
                    src="../logo.png"
                    alt=""
                >

            </div>

            <footer>
                © Zenova Educations
            </footer>

        </section>

    </main>


    <script
        type="module"
        src="./login.js"
    ></script>

</body>
</html>
