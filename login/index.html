<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | Zenova Educations</title>

  <link
    rel="stylesheet"
    href="./login.css"
  >

</head>


<body>


  <main class="page">

    <div class="login-card">


      <!-- LOGO -->

      <img
        src="../logo.png"
        class="logo"
        alt="Zenova Educations"
      >


      <!-- HEADING -->

      <h1>
        Welcome to Zenova
      </h1>


      <p class="subtitle">
        Sign in to continue to your Zenova student portal.
      </p>


      <!-- GOOGLE BUTTON -->

      <button
        id="googleBtn"
        class="google-btn"
      >

        <span class="google-icon">
          G
        </span>

        <span>
          Continue with Google
        </span>

      </button>


      <!-- ERROR -->

      <div
        id="errorBox"
        class="error-box"
      ></div>


      <!-- PRIVACY TEXT -->

      <p class="terms">
        By continuing, you agree to use your Google account
        to access Zenova Educations.
      </p>


    </div>


    <footer>
      © Zenova Educations
    </footer>


  </main>


  <script
    type="module"
    src="./login.js"
  ></script>


</body>

</html>
