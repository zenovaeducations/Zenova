<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Subjects | Zenova Hybrid Admin</title>

    <link rel="stylesheet" href="./addsubject.css">
</head>

<body>

    <div id="loader" class="loader">
        <div class="loader-ring">
            <span>Z</span>
        </div>
        <p>Loading subjects...</p>
    </div>


    <div id="app" class="app hidden">

        <header class="header">

            <div class="header-left">

                <button id="backBtn" class="back-btn">
                    ←
                </button>

                <div>
                    <div class="label">
                        HYBRID ADMIN
                    </div>

                    <h1>Subjects</h1>
                </div>

            </div>


            <button id="addBtn" class="add-btn">
                + Add Subject
            </button>

        </header>


        <div id="errorBox" class="error hidden"></div>


        <section class="stats">

            <div class="stat">
                <span>Total Subjects</span>
                <strong id="totalCount">0</strong>
            </div>

            <div class="stat">
                <span>Active</span>
                <strong id="activeCount">0</strong>
            </div>

            <div class="stat">
                <span>Inactive</span>
                <strong id="inactiveCount">0</strong>
            </div>

        </section>


        <section class="content">

            <div class="content-head">

                <div>
                    <h2>All Subjects</h2>
                    <p>
                        Subjects currently stored in the Hybrid academic library.
                    </p>
                </div>

                <input
                    type="search"
                    id="search"
                    placeholder="Search subjects..."
                >

            </div>


            <div id="subjects" class="subjects"></div>


            <div id="empty" class="empty hidden">

                <div class="empty-icon">+</div>

                <h3>No subjects found</h3>

                <p>
                    Add a subject to start building the academic library.
                </p>

                <button id="emptyAddBtn" class="add-btn">
                    + Add Subject
                </button>

            </div>

        </section>

    </div>


    <!-- SUBJECT MODAL -->

    <div id="modal" class="modal hidden">

        <div id="modalOverlay" class="modal-overlay"></div>

        <div class="modal-card">

            <div class="modal-header">

                <div>
                    <div class="label">SUBJECT</div>
                    <h2 id="modalTitle">Add Subject</h2>
                </div>

                <button id="closeBtn" class="close-btn">
                    ×
                </button>

            </div>


            <form id="subjectForm">

                <div class="field">

                    <label>Subject Name</label>

                    <input
                        id="name"
                        type="text"
                        placeholder="Physics"
                        required
                    >

                </div>


                <div class="field">

                    <label>Description</label>

                    <textarea
                        id="description"
                        rows="3"
                        placeholder="Subject description"
                    ></textarea>

                </div>


                <div class="row">

                    <div class="field">

                        <label>Medium</label>

                        <select id="medium">

                            <option value="Kannada">Kannada</option>
                            <option value="English">English</option>
                            <option value="Both">Both</option>

                        </select>

                    </div>


                    <div class="field">

                        <label>Priority</label>

                        <input
                            id="priority"
                            type="number"
                            min="0"
                            value="0"
                        >

                    </div>

                </div>


                <div class="field">

                    <label>Target Classes</label>

                    <div class="classes">

                        <label>
                            <input type="checkbox" value="Under 8th">
                            Under 8th
                        </label>

                        <label>
                            <input type="checkbox" value="8th">
                            8th
                        </label>

                        <label>
                            <input type="checkbox" value="9th">
                            9th
                        </label>

                        <label>
                            <input type="checkbox" value="10th">
                            10th
                        </label>

                        <label>
                            <input type="checkbox" value="1st PUC">
                            1st PUC
                        </label>

                        <label>
                            <input type="checkbox" value="2nd PUC">
                            2nd PUC
                        </label>

                    </div>

                </div>


                <label class="active-row">

                    <div>
                        <strong>Active Subject</strong>
                        <small>
                            Active subjects are available to students.
                        </small>
                    </div>

                    <input
                        id="active"
                        type="checkbox"
                        checked
                    >

                </label>


                <div id="formError" class="form-error hidden"></div>


                <div class="actions">

                    <button
                        type="button"
                        id="cancelBtn"
                        class="cancel-btn"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        id="saveBtn"
                        class="save-btn"
                    >
                        Save Subject
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script type="module" src="./addsubject.js"></script>

</body>
</html>
