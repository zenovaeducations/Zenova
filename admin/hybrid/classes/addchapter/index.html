<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chapters | Zenova Hybrid</title>

    <link
        rel="stylesheet"
        href="./chapter.css"
    >

</head>


<body>


<!-- LOADER -->

<div
    id="loader"
    class="loader"
>

    <div class="loader-ring">

        <span>Z</span>

    </div>

    <p>Loading...</p>

</div>



<!-- ERROR SCREEN -->

<div
    id="errorScreen"
    class="error-screen hidden"
>

    <div class="error-box">

        <div class="error-mark">
            !
        </div>

        <h2>
            Unable to load
        </h2>

        <p id="errorMessage">
            Something went wrong.
        </p>

        <button
            id="retryButton"
            class="black-button"
        >
            TRY AGAIN
        </button>

        <button
            id="errorBackButton"
            class="secondary-button"
        >
            BACK TO SUBJECTS
        </button>

    </div>

</div>



<!-- APPLICATION -->

<main
    id="app"
    class="hidden"
>


    <!-- HEADER -->

    <header class="topbar">

        <button
            id="backButton"
            class="back-button"
            type="button"
        >
            ←
        </button>


        <div class="header-text">

            <div class="small-label">
                HYBRID CLASSES
            </div>

            <h1>
                Chapters
            </h1>

        </div>

    </header>



    <!-- SUBJECT -->

    <section class="subject-card">

        <div class="subject-label">
            SUBJECT
        </div>

        <h2 id="subjectTitle">
            —
        </h2>

        <p id="subjectDescription">
            —
        </p>

    </section>



    <!-- CHAPTER SECTION -->

    <section class="content-section">


        <div class="section-header">

            <div>

                <div class="small-label">
                    CONTENT
                </div>

                <h2>
                    Chapters
                </h2>

            </div>


            <button
                id="addChapterButton"
                class="black-button"
                type="button"
            >
                + ADD CHAPTER
            </button>

        </div>



        <!-- CHAPTER LIST -->

        <div
            id="chaptersList"
            class="chapters-list"
        >
        </div>



        <!-- EMPTY -->

        <div
            id="emptyState"
            class="empty-state hidden"
        >

            <div class="empty-plus">
                +
            </div>

            <h3>
                No chapters yet
            </h3>

            <p>
                Create the first chapter for this subject.
            </p>

            <button
                id="emptyAddButton"
                class="black-button"
                type="button"
            >
                + ADD CHAPTER
            </button>

        </div>


    </section>


</main>



<!-- ADD / EDIT MODAL -->

<div
    id="chapterModal"
    class="modal hidden"
>

    <div class="modal-box">


        <div class="modal-top">

            <div>

                <div class="small-label">
                    CHAPTER
                </div>

                <h2 id="modalTitle">
                    Add Chapter
                </h2>

            </div>


            <button
                id="closeModal"
                class="close-button"
                type="button"
            >
                ×
            </button>

        </div>



        <form id="chapterForm">


            <!-- CHAPTER NUMBER -->

            <div class="form-group">

                <label for="chapterNumber">
                    Chapter Number
                </label>

                <input
                    id="chapterNumber"
                    type="number"
                    min="1"
                    step="1"
                    placeholder="1"
                    required
                >

            </div>



            <!-- TITLE -->

            <div class="form-group">

                <label for="chapterTitle">
                    Chapter Title
                </label>

                <input
                    id="chapterTitle"
                    type="text"
                    placeholder="Example: Units and Measurements"
                    required
                >

            </div>



            <!-- DESCRIPTION -->

            <div class="form-group">

                <label for="chapterDescription">
                    Description
                    <span class="optional">
                        Optional
                    </span>
                </label>

                <textarea
                    id="chapterDescription"
                    rows="4"
                    placeholder="Short description of the chapter"
                ></textarea>

            </div>



            <!-- PRIORITY + STATUS -->

            <div class="two-columns">


                <div class="form-group">

                    <label for="chapterPriority">
                        Priority
                    </label>

                    <input
                        id="chapterPriority"
                        type="number"
                        min="0"
                        step="1"
                        value="0"
                    >

                </div>


                <div class="form-group">

                    <label for="chapterActive">
                        Status
                    </label>

                    <select id="chapterActive">

                        <option value="true">
                            Active
                        </option>

                        <option value="false">
                            Inactive
                        </option>

                    </select>

                </div>


            </div>



            <!-- ERROR -->

            <div
                id="formError"
                class="form-error hidden"
            ></div>



            <!-- SAVE -->

            <button
                id="saveButton"
                class="save-button"
                type="submit"
            >
                SAVE CHAPTER
            </button>


        </form>


    </div>

</div>



<script
    type="module"
    src="./chapter.js"
></script>


</body>

</html>
