<div class="form-group">

    <label>
        BANNER IMAGE
    </label>

    <input
        id="imageFile"
        type="file"
        accept="image/png,image/jpeg,image/webp"
        required
    >

    <small>
        Upload a 16:9 banner image. JPG, PNG or WEBP.
    </small>

</div>


<div class="preview-wrap">

    <div class="preview-label">
        16:9 LIVE PREVIEW
    </div>

    <div class="image-preview">

        <img
            id="imagePreview"
            alt="Banner preview"
        >

        <div
            id="previewPlaceholder"
            class="preview-placeholder"
        >
            Select an image
        </div>

    </div>

</div>
