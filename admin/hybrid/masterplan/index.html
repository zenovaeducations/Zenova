<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Master Plan — Zenova Admin</title>

    <link
        rel="stylesheet"
        href="./masterplan.css"
    >

</head>

<body>

<div id="loader" class="loader">
    <div class="loader-ring">
        <span>Z</span>
    </div>
</div>


<main id="app" class="app hidden">

    <!-- HEADER -->

    <header class="topbar">

        <button
            id="backButton"
            class="back-button"
            type="button"
        >
            ←
        </button>

        <div>
            <p class="eyebrow">
                HYBRID ADMIN
            </p>

            <h1>
                Master Plan
            </h1>
        </div>

        <div class="admin-badge">
            ADMIN
        </div>

    </header>


    <!-- DATE -->

    <section class="date-section">

        <div>

            <p class="label">
                SELECT DATE
            </p>

            <input
                id="planDate"
                type="date"
            >

        </div>


        <div class="status-box">

            <span
                id="statusDot"
                class="status-dot"
            ></span>

            <span id="statusText">
                INACTIVE
            </span>

        </div>

    </section>


    <!-- PLAN SETTINGS -->

    <section class="card">

        <div class="card-heading">

            <div>
                <p class="label">
                    PLAN
                </p>

                <h2>
                    Plan Settings
                </h2>
            </div>

        </div>


        <div class="field">

            <label>
                Priority
            </label>

            <input
                id="priority"
                type="number"
                value="1"
                min="1"
            >

        </div>


        <label class="toggle-row">

            <div>

                <strong>
                    Publish Plan
                </strong>

                <span>
                    Students can see this plan on their Home.
                </span>

            </div>

            <input
                id="active"
                type="checkbox"
                checked
            >

            <span class="toggle"></span>

        </label>

    </section>


    <!-- TASKS -->

    <section class="card">

        <div class="card-heading">

            <div>

                <p class="label">
                    DAILY SCHEDULE
                </p>

                <h2>
                    Tasks
                </h2>

            </div>


            <button
                id="addTaskButton"
                class="primary-small"
                type="button"
            >
                + ADD TASK
            </button>

        </div>


        <div
            id="taskList"
            class="task-list"
        ></div>


        <div
            id="emptyTasks"
            class="empty hidden"
        >
            <strong>
                No tasks added
            </strong>

            <p>
                Add the activities students should complete today.
            </p>
        </div>

    </section>


    <!-- SAVE -->

    <section class="save-section">

        <button
            id="saveButton"
            class="save-button"
            type="button"
        >
            SAVE MASTER PLAN
        </button>

        <p id="saveMessage"></p>

    </section>

</main>


<!-- =====================================================
     TASK MODAL
====================================================== -->

<div
    id="taskModal"
    class="modal hidden"
>

    <div class="modal-card">

        <div class="modal-header">

            <div>

                <p class="label">
                    MASTER PLAN
                </p>

                <h2>
                    Add Task
                </h2>

            </div>


            <button
                id="closeModal"
                class="close-button"
                type="button"
            >
                ×
            </button>

        </div>


        <div class="field">

            <label>
                Task Type
            </label>

            <select id="taskType">

                <option value="VIDEO">
                    Recorded Video
                </option>

                <option value="LIVE">
                    Live Class
                </option>

                <option value="NOTES">
                    Notes
                </option>

                <option value="PDF">
                    PDF
                </option>

                <option value="TEST">
                    Test
                </option>

                <option value="ASSIGNMENT">
                    Assignment
                </option>

                <option value="STUDY">
                    Study
                </option>

            </select>

        </div>


        <div class="two-column">

            <div class="field">

                <label>
                    Time
                </label>

                <input
                    id="taskTime"
                    type="time"
                >

            </div>


            <div class="field">

                <label>
                    Subject
                </label>

                <input
                    id="taskSubject"
                    type="text"
                    placeholder="Mathematics"
                >

            </div>

        </div>


        <div class="field">

            <label>
                Task Title
            </label>

            <input
                id="taskTitle"
                type="text"
                placeholder="Quadratic Equations"
            >

        </div>


        <div class="field">

            <label>
                Chapter / Topic
            </label>

            <input
                id="taskChapter"
                type="text"
                placeholder="Quadratic Equations"
            >

        </div>


        <div class="field">

            <label>
                Resource URL
            </label>

            <input
                id="resourceUrl"
                type="url"
                placeholder="https://..."
            >

            <small>
                Optional. This can later point directly to the Zenova
                video player, live class, notes, test, etc.
            </small>

        </div>


        <div class="modal-actions">

            <button
                id="cancelTask"
                class="secondary-button"
                type="button"
            >
                CANCEL
            </button>

            <button
                id="addTask"
                class="primary-button"
                type="button"
            >
                ADD TASK
            </button>

        </div>

    </div>

</div>


<script
    type="module"
    src="./masterplan-core.js"
></script>

</body>
</html>
